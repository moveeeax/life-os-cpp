# Production values of the life-os-cpp-worker: same namespace, same database
# and Redis as the API. Secrets via extraEnvFrom from life-os-app.

# Bump together with deploy/values-prod.yaml after a secret rotation; the
# worker pods restart with the new values.
secretsVersion: ""

image:
  repository: ghcr.io/moveeeax/life-os-cpp-worker
  tag: "1.52.4"

replicaCount: 1

extraEnvFrom:
  - secretRef:
      name: life-os-app
  - configMapRef:
      name: life-os-sync-tuning
      optional: true
  # LLM settings of the food module (food_parse job); the key is in the Secret life-os-food-llm.
  - configMapRef:
      name: life-os-food-llm
      optional: true
  - secretRef:
      name: life-os-food-llm
      optional: true
  # LLM settings of the money module (money_parse job); the key is in the Secret life-os-money-llm.
  - configMapRef:
      name: life-os-money-llm
      optional: true
  - secretRef:
      name: life-os-money-llm
      optional: true
  # The prompt of the tasks parse; the provider and key are the money module's.
  - configMapRef:
      name: life-os-tasks-llm
      optional: true

externalDatabase:
  host: postgresql-rw.db.svc.cluster.local
  port: 5432
  name: life_os
  user: life-os
  password: ""
  poolSize: 3
  # Sync writes to the primary; the worker needs no replica.
  replicaHost: ""
  migrationsEnabled: false

externalRedis:
  url: "tcp://redis.db.svc.cluster.local:6379"
  useSentinel: false
  db: 3

worker:
  # WORKER_ID is the pod name (chart default, id: ""), so a replaced pod never
  # shares a processing list with the one it replaced.
  id: ""
  # The worker pulls only the listed queues: without fitness_sync, sync jobs
  # would pile up in Redis silently. Mail is off, its queues are not subscribed.
  types: "fitness_sync,leetcode_sync,food_parse,money_rates,money_parse,money_advisor,tasks_parse,now_media_sweep,files_sweep"
  # One sync per system by construction.
  concurrency: 1

jobs:
  enabled: true
  # A failed job waits 2 s, 4 s, ... before its retry: with an immediate
  # requeue a parse whose row was still held spent its retries in milliseconds.
  retryBackoffBaseMs: 2000
  # A job whose pod was killed goes back to the queue after 300 s. The worker
  # renews the lease of a running job every 100 s (a third of it), so a
  # handler may run longer than this (a fitness sync runs up to
  # MI_FITNESS_SYNC_TYPE_TIMEOUT, 1800 s, per data type) without being reaped.
  visibilityTimeoutSec: 300

fitness:
  enabled: true

# The worker matches finished workouts with the band data after each sync.
workout:
  enabled: true

# The food_parse job.
food:
  enabled: true

# The money_rates and money_parse jobs.
money:
  enabled: true

tasks:
  enabled: true

goals:
  enabled: true

travel:
  enabled: true

habits:
  enabled: true

notes:
  enabled: true

practice:
  enabled: true

# The family medical archive. Its files need the private prefix in the MinIO
# policy first (docs/RUNBOOK.md, private files); without it uploads answer 503.
medical:
  enabled: true

# Invite-only: self sign-up is closed, admins invite people (POST /api/v1/admin/invite).
registration:
  open: false

now:
  enabled: true

# The same bucket and keys as the API (deploy/values-prod.yaml): the
# now_media_sweep job deletes the objects of wallpaper and sound rows left pending.
storage:
  s3:
    endpoint: "https://s3.tarassov.me"
    region: "us-east-1"
    bucket: "life-os"
    prefix: "life-os/"
    publicBaseUrl: "https://s3.tarassov.me/life-os"
    pathStyle: true
    credentialsSecret:
      name: life-os-s3
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key

# The site's address: the links the app renders (account e-mails, Ani's
# webhook URL in the settings) start with it.
app:
  baseUrl: "https://life-os.tarassov.me"
  name: Life OS

mail:
  enabled: false

tracing:
  enabled: false

# Monitoring stays OFF until prometheus-operator is confirmed on oci-k3s; see
# the monitoring block in deploy/values-prod.yaml for the check and the exact
# values to flip. Then: serviceMonitor.enabled: true, monitoring.alertsEnabled:
# true, monitoring.targetSelector as for the API (service="life-os-cpp-worker").
serviceMonitor:
  enabled: false
monitoring:
  alertsEnabled: false
  targetSelector: ""
