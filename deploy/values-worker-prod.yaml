# Боевые значения воркера life-os-cpp-worker: тот же namespace, та же база
# и Redis, что у API. Секреты через extraEnvFrom из life-os-app.

image:
  repository: ghcr.io/moveeeax/life-os-cpp-worker
  tag: "1.7.0"

replicaCount: 1

extraEnvFrom:
  - secretRef:
      name: life-os-app
  - configMapRef:
      name: life-os-sync-tuning
      optional: true

externalDatabase:
  host: postgresql-rw.db.svc.cluster.local
  port: 5432
  name: life_os
  user: life-os
  password: ""
  poolSize: 3
  # Синк пишет на праймери, реплика воркеру не нужна.
  replicaHost: ""
  migrationsEnabled: false

externalRedis:
  url: "tcp://redis.db.svc.cluster.local:6379"
  useSentinel: false
  db: 3

worker:
  # Воркер тянет только перечисленные очереди: без fitness_sync задания синка
  # копились бы в Redis молча. Почта выключена, её очереди не подписываем.
  types: "fitness_sync"
  # Синк один на систему по построению.
  concurrency: 1

jobs:
  enabled: true

fitness:
  enabled: true

mail:
  enabled: false

tracing:
  enabled: false
