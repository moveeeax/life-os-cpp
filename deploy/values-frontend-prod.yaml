# Production values of the frontend (chart helm/cpp-frontend) in cluster
# oci-k3s, namespace life-os, release name life-os-cpp-frontend.
#
# The frontend is the public entry point of life-os.tarassov.me: nginx serves
# the SPA and proxies /api/ to the API Service. See docs/ARCHITECTURE.md §6.

image:
  repository: ghcr.io/moveeeax/life-os-cpp-frontend
  tag: "1.46.0"

replicaCount: 1

# Service of the API release (helm release life-os-cpp) in the same namespace.
backend:
  service: life-os-cpp
  port: 8080

ingress:
  enabled: true
  # The cluster's IngressClass "nginx" is served by Traefik (controller
  # traefik.io/ingress-controller, next to the default class "traefik"), not
  # by ingress-nginx. So the hops in front of the API are Traefik, then this
  # chart's nginx: the two proxies values-prod.yaml counts.
  className: nginx
  certManager:
    clusterIssuer: letsencrypt-prod
  hosts:
    - host: life-os.tarassov.me
      paths:
        - path: /
          pathType: Prefix
  # Same secret the API ingress has been using for this host.
  tls:
    - hosts: [life-os.tarassov.me]
      secretName: life-os-tls

# The wallpaper bucket (pictures, videos and the admin's direct upload).
csp:
  storageHosts:
    - https://s3.tarassov.me
  # Ani's voice: the browser's WebRTC offer goes to OpenAI.
  connectHosts:
    - https://api.openai.com
