# Production values of life-os-cpp in cluster oci-k3s,
# namespace life-os. No secrets here: everything sensitive lives in the
# Secret life-os-app and arrives via extraEnvFrom.
#
# This file plus the chart is the only description of the production API
# config: `make prod-check` renders it and checks the result,
# scripts/check-helm-render.sh asserts the security floor in CI.

image:
  repository: ghcr.io/moveeeax/life-os-cpp
  tag: "1.53.0"

replicaCount: 1

# After rotating a key in life-os-app (or any Secret below), bump this string
# and upgrade: the pods restart with the new value (the chart hashes only its
# own ConfigMap). Same string in deploy/values-worker-prod.yaml.
secretsVersion: ""

extraEnvFrom:
  - secretRef:
      name: life-os-app
  # Sync knobs and schedule of the fitness module: deploy/sync-tuning-configmap.yaml.
  # The scheduled sync timer lives in the API pod.
  - configMapRef:
      name: life-os-sync-tuning
      optional: true
  # LLM settings of the food module; the key is in the Secret life-os-food-llm.
  - configMapRef:
      name: life-os-food-llm
      optional: true
  - secretRef:
      name: life-os-food-llm
      optional: true
  # LLM settings of the money module; the key is in the Secret life-os-money-llm.
  - configMapRef:
      name: life-os-money-llm
      optional: true
  - secretRef:
      name: life-os-money-llm
      optional: true
  # The prompt of the tasks parse; the provider and key are the money module's.
  - configMapRef:
      name: life-os-tasks-llm
      optional: true
  # Ani's voice on Now: ANI_VOICE_API_KEY (an OpenAI key) in the Secret
  # life-os-ani-voice; without it POST /api/v1/now/voice-session answers 503.
  - secretRef:
      name: life-os-ani-voice
      optional: true
  # Ani's agent (docs/RUNBOOK.md "Ani's agents"): the API reads the switch and
  # the pod limit from the Secret life-os-ani-agent; without it the
  # /api/v1/ani/agent routes answer 404.
  - secretRef:
      name: life-os-ani-agent
      optional: true

externalDatabase:
  host: postgresql-rw.db.svc.cluster.local
  port: 5432
  name: life_os
  user: life-os
  # The password arrives as the DATABASE_PASSWORD variable from life-os-app.
  password: ""
  poolSize: 5
  replicaHost: postgresql-ro.db.svc.cluster.local
  # Migrations run once, in the init container below, not again at app start.
  migrationsEnabled: false

migrations:
  runAsInitContainer: true

externalRedis:
  url: "tcp://redis.db.svc.cluster.local:6379"
  useSentinel: false
  # Separate logical index: Redis is shared, keys must not collide with other
  # applications in the cluster. Index 3 is inherited from mi-fitness-api
  # after it was stopped.
  db: 3

# No ingress of its own: the frontend release (deploy/values-frontend-prod.yaml)
# is the public entry point of life-os.tarassov.me and proxies /api/ to this
# Service. Probes and /metrics are reachable only inside the cluster.
ingress:
  enabled: false

auth:
  cookies:
    # Login issues tokens as __Host-* cookies, and the middleware reads them
    # only when the flag is on. Machine access goes via X-API-Key and does not
    # depend on the flag.
    enabled: true
    secure: true
  # Double-submit token for cookie sessions; the SPA echoes the csrf-token
  # cookie on every mutating request (frontend/src/lib/api/client.ts).
  csrf:
    enabled: true

# Login throttling and the API limit. Two proxies stand in front: Traefik
# keeps the client address (proxy protocol from the balancer) and sets
# X-Real-Ip; the frontend nginx of the cpp-frontend chart passes that header
# through. The failed-login audit shows the client address, so the login is
# limited per client; signed-in requests are limited per user. The API takes
# X-Real-Ip first; trustedProxyCount applies only when that header is absent
# and the client is read from X-Forwarded-For (Traefik writes the client,
# nginx appends Traefik's address, so the client is 2 from the right). The
# frontend ingress's className "nginx" names a Traefik IngressClass in this
# cluster (values-frontend-prod.yaml), so there is no third proxy.
rateLimit:
  enabled: true
  trustProxy: true
  trustedProxyCount: 2
  # Redis down → refuse rather than let the login go unthrottled; sessions live
  # in Redis too, so without it signing in fails either way.
  failOpen: false
  # Rejected credentials per client IP, and failed logins per email address.
  authFailRequests: 20
  authFailWindowSec: 60
  loginEmailRequests: 5
  loginEmailWindowSec: 900

# Retried mutating requests with an Idempotency-Key are answered once.
idempotency:
  enabled: true

# TLS ends at the ingress; the API's own responses carry
# Strict-Transport-Security too, so a proxied /api/ answer never downgrades it.
security:
  hsts: true

# The Swagger UI stays off: it exposes the whole surface.
docs:
  enabled: false

# Enqueueing sync jobs requires an initialized queue on the API side too;
# the jobs themselves are executed by the worker.
jobs:
  enabled: true

# Outbox relay: rows the API writes into the outbox table inside the request's
# transaction reach the Redis queue within this many seconds, so a crash
# between the row and the enqueue no longer leaves a job `queued` forever.
outbox:
  drainIntervalSec: 5

fitness:
  enabled: true

# Workout section: routines, the workout log and its links to the fitness data.
workout:
  enabled: true

# Food section: diary, products, goals, Open Food Facts, the LLM parse.
food:
  enabled: true

# Money section: accounts, the ledger, transfers, budgets, reports, the LLM parse.
money:
  enabled: true

tasks:
  enabled: true

goals:
  enabled: true

travel:
  enabled: true

habits:
  enabled: true

notes:
  enabled: true

practice:
  enabled: true

# The family medical archive. Its files need the private prefix in the MinIO
# policy first (docs/RUNBOOK.md, private files); without it uploads answer 503.
medical:
  enabled: true

# Invite-only: self sign-up is closed, admins invite people (POST /api/v1/admin/invite).
registration:
  open: false

now:
  enabled: true

# The wallpaper library: bucket life-os on the cluster's MinIO (s3.tarassov.me),
# user life-os with put/get/delete on life-os/wallpapers/* only, anonymous read
# on that prefix. Keys in the Secret life-os-s3 (namespace life-os).
# The private files of the medical archive and travel documents go to
# life-os/private/*: the user needs put/get/delete there too, and that prefix
# gets NO anonymous read (docs/RUNBOOK.md, "Private files").
storage:
  s3:
    endpoint: "https://s3.tarassov.me"
    region: "us-east-1"
    bucket: "life-os"
    prefix: "life-os/"
    publicBaseUrl: "https://s3.tarassov.me/life-os"
    pathStyle: true
    credentialsSecret:
      name: life-os-s3
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key

# The site's address: the links the app renders (account e-mails, Ani's
# webhook URL in the settings) start with it.
app:
  baseUrl: "https://life-os.tarassov.me"
  name: Life OS

mail:
  enabled: false

tracing:
  enabled: false

# Pod-level firewall (templates/networkpolicy.yaml). The API has no ingress of
# its own: only the frontend pods of release life-os-cpp-frontend proxy to it.
# Egress: Postgres and Redis in namespace db, DNS (built into the template),
# and HTTPS anywhere (s3.tarassov.me for wallpapers, the LLM providers of the
# food/money/tasks parse, Xiaomi for the fitness sync, Open Food Facts).
# Mail, OTLP and Sentinel are off in production, so no ports for them.
# Verify on the first rollout that the probes stay green (the kubelet's
# probes come from the node; k3s's policy controller lets them through, but
# check it) and that the migrate init container still reaches Postgres.
networkPolicy:
  enabled: true
  ingress:
    fromSelectors:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: cpp-frontend
            app.kubernetes.io/instance: life-os-cpp-frontend
      # Ani's agent tools: the ani worker reads the user's data through the API
      # (ANI_AGENT_API_URL, src/agent/Tools.hpp).
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: life-os-cpp-worker
            app.kubernetes.io/instance: life-os-ani-worker
    # PLACEHOLDER: the namespace of the Prometheus that will scrape :9090 is
    # not known from this repository. `monitoring` is the chart default and
    # harmless while no such namespace exists; set the real one together with
    # serviceMonitor.enabled below.
    metricsFromSelectors:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
  egress:
    extra:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: db
        ports:
          - port: 5432
            protocol: TCP
          - port: 6379
            protocol: TCP
      - ports:
          - port: 443
            protocol: TCP

# Monitoring. Everything stays OFF until the owner confirms that
# prometheus-operator (the ServiceMonitor and PrometheusRule CRDs) runs on
# oci-k3s: `kubectl --context oci-k3s get crd servicemonitors.monitoring.coreos.com
# prometheusrules.monitoring.coreos.com`. The repository cannot tell, and a
# helm upgrade that renders these kinds against a cluster without the CRDs
# fails. Once confirmed, flip exactly these:
#   serviceMonitor.enabled: true
#   monitoring.alertsEnabled: true
#   monitoring.jobsAlerts: true
#   monitoring.targetSelector: the label set the cluster's Prometheus puts on
#     this Service's targets (open Prometheus > Targets and copy it; the
#     chart default is service="life-os-cpp"), e.g. 'namespace="life-os", service="life-os-cpp"'
#   networkPolicy.ingress.metricsFromSelectors: the Prometheus namespace (above)
serviceMonitor:
  enabled: false
monitoring:
  alertsEnabled: false
  jobsAlerts: false
  targetSelector: ""

# Off-cluster copy of the CNPG barman store (templates/backup-mirror-cronjob.yaml).
# Off until a destination bucket exists. The source is the live backup bucket
# of docs/RUNBOOK.md "Backups"; its credentials live in Secret
# minio-backups-creds in namespace db and must be copied into a Secret in
# this namespace (a CronJob cannot read another namespace's Secret).
backupMirror:
  enabled: false
  mode: copy
  source:
    endpoint: "http://minio.minio.svc.cluster.local:9000"
    provider: Minio
    bucket: tarassov-me-backups
    prefix: "cnpg/"
    pathStyle: true
    credentialsSecret:
      name: ""                       # PLACEHOLDER: copy of minio-backups-creds in namespace life-os
      accessKeyIdKey: ACCESS_KEY_ID
      secretAccessKeyKey: ACCESS_SECRET_KEY
  destination:
    endpoint: ""                     # PLACEHOLDER: the external provider's S3 endpoint (empty for AWS)
    provider: AWS                    # PLACEHOLDER: AWS, Minio, Other, ... (rclone s3 provider)
    region: ""
    bucket: ""                       # PLACEHOLDER: the off-cluster bucket
    prefix: "cnpg/"
    pathStyle: false
    credentialsSecret:
      name: ""                       # PLACEHOLDER: Secret in namespace life-os with the destination keys
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
