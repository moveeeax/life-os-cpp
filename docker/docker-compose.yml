# Shared environment fragments. app and worker must agree on these — the
# worker sends account emails (tokens + SMTP + links), so a key added to one
# list but not the other produces silent anonymous-SMTP / wrong-link bugs.
# YAML merge keys need map-form environment blocks below.
x-data-env: &data-env
  DATABASE_PRIMARY_URL: ${DATABASE_PRIMARY_URL:-postgresql://postgres:postgres@postgres:5432/appdb}
  DATABASE_REPLICA_URLS: ${DATABASE_REPLICA_URLS:-}
  REDIS_URL: ${REDIS_URL:-tcp://redis:6379}
  REDIS_USE_SENTINEL: ${REDIS_USE_SENTINEL:-false}
  REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-mymaster}
  REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}

# Auth — JWT in HttpOnly cookies. Defaults keep auth disabled so `make up`
# stays open. The `with-frontend` profile / .env.everything flips
# AUTH_MODE=jwt + secrets so the SPA logs in. The worker needs the secret
# too: account_email jobs issue confirmation/reset tokens.
x-auth-env: &auth-env
  AUTH_MODE: ${AUTH_MODE:-none}
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_ISSUER: ${JWT_ISSUER:-}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-}
  AUTH_COOKIES_ENABLED: ${AUTH_COOKIES_ENABLED:-false}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
  AUTH_COOKIE_ACCESS: ${AUTH_COOKIE_ACCESS:-__Host-access}
  AUTH_COOKIE_REFRESH: ${AUTH_COOKIE_REFRESH:-__Host-refresh}

# Mail — points at the Mailpit dev sidecar by default. Full credential set:
# with a production STARTTLS server, a missing username/password here means
# both containers silently connect anonymously.
x-mail-env: &mail-env
  MAIL_ENABLED: ${MAIL_ENABLED:-false}
  MAIL_VIA_JOBS: ${MAIL_VIA_JOBS:-true}
  MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
  MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
  MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
  MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
  MAIL_SMTP_USE_TLS: ${MAIL_SMTP_USE_TLS:-false}
  MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-App}
  MAIL_SUBJECT_PREFIX: "${MAIL_SUBJECT_PREFIX:-[App] }"
  APP_NAME: ${APP_NAME:-App}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}

services:
  # Application service
  app:
    # Default: pull the public image release.yml publishes on a `v*` tag (the
    # last release, not this checkout). `make up-*` does `pull` (no local
    # build). To run your own code use `make quickstart` / `make up-build` /
    # `make dev` (or `docker compose ... up --build`), which use the build:
    # block below.
    image: ${APP_IMAGE:-ghcr.io/moveeeax/life-os-cpp:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      cache_from:
        - ${BUILDER_CACHE_IMAGE:-life-os-cpp:builder-latest}
    container_name: life_os_cpp_app
    ports:
      - "8080:8080"  # API
      - "9090:9090"  # Metrics
    environment:
      <<: [*data-env, *auth-env, *mail-env]
      JOBS_ENABLED: ${JOBS_ENABLED:-false}
      JOBS_RESULT_TTL: ${JOBS_RESULT_TTL:-86400}
      JOBS_MAX_RETRIES: ${JOBS_MAX_RETRIES:-3}
      JOBS_RETRY_BACKOFF_BASE_MS: ${JOBS_RETRY_BACKOFF_BASE_MS:-2000}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      FITNESS_ENABLED: ${FITNESS_ENABLED:-false}
      WORKOUT_ENABLED: ${WORKOUT_ENABLED:-false}
      FOOD_ENABLED: ${FOOD_ENABLED:-false}
      MONEY_ENABLED: ${MONEY_ENABLED:-false}
      TASKS_ENABLED: ${TASKS_ENABLED:-false}
      GOALS_ENABLED: ${GOALS_ENABLED:-false}
      TRAVEL_ENABLED: ${TRAVEL_ENABLED:-false}
      HABITS_ENABLED: ${HABITS_ENABLED:-false}
      NOTES_ENABLED: ${NOTES_ENABLED:-false}
      PRACTICE_ENABLED: ${PRACTICE_ENABLED:-false}
      MEDICAL_ENABLED: ${MEDICAL_ENABLED:-false}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      NOW_ENABLED: ${NOW_ENABLED:-false}
      # Rate limiting, idempotency and CSRF: the defaults are the values of
      # config/config.json, so an unset variable changes nothing; the chart
      # sets the same envs in prod (scripts/check-config-sync.sh compares).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
      RATE_LIMIT_SCOPE: ${RATE_LIMIT_SCOPE:-ip_or_user}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-false}
      RATE_LIMIT_TRUSTED_PROXY_COUNT: ${RATE_LIMIT_TRUSTED_PROXY_COUNT:-1}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      RATE_LIMIT_WHITELIST: ${RATE_LIMIT_WHITELIST:-}
      RATE_LIMIT_AUTH_FAIL_REQUESTS: ${RATE_LIMIT_AUTH_FAIL_REQUESTS:-20}
      RATE_LIMIT_AUTH_FAIL_WINDOW_SEC: ${RATE_LIMIT_AUTH_FAIL_WINDOW_SEC:-60}
      RATE_LIMIT_LOGIN_EMAIL_REQUESTS: ${RATE_LIMIT_LOGIN_EMAIL_REQUESTS:-5}
      RATE_LIMIT_LOGIN_EMAIL_WINDOW_SEC: ${RATE_LIMIT_LOGIN_EMAIL_WINDOW_SEC:-900}
      IDEMPOTENCY_ENABLED: ${IDEMPOTENCY_ENABLED:-false}
      IDEMPOTENCY_TTL_SEC: ${IDEMPOTENCY_TTL_SEC:-86400}
      IDEMPOTENCY_LOCK_TTL_SEC: ${IDEMPOTENCY_LOCK_TTL_SEC:-30}
      IDEMPOTENCY_MAX_BODY_KB: ${IDEMPOTENCY_MAX_BODY_KB:-1024}
      IDEMPOTENCY_MAX_RESPONSE_KB: ${IDEMPOTENCY_MAX_RESPONSE_KB:-256}
      SECURITY_CSRF_ENABLED: ${SECURITY_CSRF_ENABLED:-false}
      # Wallpapers and focus sounds (docs/wallpapers.md). An empty bucket
      # makes those routes answer 503 storage_not_configured.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-life-os/}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      SERVICE_NAME: ${SERVICE_NAME:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_THREADS: ${SERVER_THREADS:-4}
      CONFIG_FILE: ${CONFIG_FILE:-config/config.json}
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Test runner service
  #
  # Points at a dedicated test-redis (see below) rather than the shared
  # `redis` service — otherwise, when `make up` is running, the worker
  # container BRPOPs test-submitted jobs off the shared queue and the
  # assertions that expect "pending" see "processing" / "failed" instead.
  test-runner:
    # If TEST_IMAGE is set and already present locally (CI pulls the image that
    # build:docker produced), `compose up` reuses it instead of recompiling.
    # Locally TEST_IMAGE is unset → the :test-latest tag is missing → compose
    # falls back to the build: block below (`make test` runs `compose build
    # test-runner` first to force a fresh compile).
    image: ${TEST_IMAGE:-life-os-cpp:test-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test-runner
      cache_from:
        - ${BUILDER_CACHE_IMAGE:-life-os-cpp:builder-latest}
    container_name: life_os_cpp_test_runner
    environment:
      - TEST_PG_HOST=test-postgres
      - TEST_REDIS_HOST=test-redis
      # Set by ci.yml: makes missing Postgres/Redis FAIL the suites instead of
      # SKIP-and-report-green (see test_helpers.hpp). Empty locally = old
      # skip-friendly behavior.
      - CI_REQUIRE_INFRA=${CI_REQUIRE_INFRA:-}
      # No DB_MIGRATIONS_ENABLED=false here: env overrides JSON config, and
      # the fresh test-postgres relies on suites running MigrationRunner to
      # provision the schema (the shared dev postgres used to get it from an
      # initdb mount, which masked this).
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - test

  # Test-only Postgres — isolated from the dev stack: integration suites
  # TRUNCATE tables, which used to wipe dev users on the shared instance.
  # No volume → fresh data every `up`, gone on `down`. Port not published.
  test-postgres:
    image: postgres:18-alpine
    container_name: life_os_cpp_test_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=appdb
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - test

  # Test-only Redis — isolated from the dev stack so the worker container
  # can't race with BRPOP against test fixtures.
  test-redis:
    image: redis:7-alpine
    container_name: life_os_cpp_test_redis
    command: redis-server --save ""
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    profiles:
      - test

  # Background job worker
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/moveeeax/life-os-cpp-worker:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker-runtime
      cache_from:
        - ${BUILDER_CACHE_IMAGE:-life-os-cpp:builder-latest}
    container_name: life_os_cpp_worker
    ports:
      - "9091:9091"
      - "9190:9090"  # Metrics (remapped to avoid conflict with app:9090)
    environment:
      # Same data/auth/mail env as app — see the x-*-env anchors up top.
      <<: [*data-env, *auth-env, *mail-env]
      JOBS_ENABLED: "true"
      # Same retry budget and result TTL as the app: both processes read them
      # when the job queue starts (src/core/Core.cpp).
      JOBS_RESULT_TTL: ${JOBS_RESULT_TTL:-86400}
      JOBS_MAX_RETRIES: ${JOBS_MAX_RETRIES:-3}
      # A failed job waits 2 s, 4 s, ... before its retry instead of spending
      # the retry budget at once.
      JOBS_RETRY_BACKOFF_BASE_MS: ${JOBS_RETRY_BACKOFF_BASE_MS:-2000}
      # Processing lease: 0 (the code default) disables it; the prod overlay
      # (deploy/values-worker-prod.yaml) sets 300 so a dead worker's job is
      # re-queued.
      JOBS_VISIBILITY_TIMEOUT_SEC: ${JOBS_VISIBILITY_TIMEOUT_SEC:-0}
      # billing module: the same switch as the app.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      # fitness module: the worker must see the same switch as the app, or it
      # finishes every fitness_sync job as failed/fitness_disabled.
      FITNESS_ENABLED: ${FITNESS_ENABLED:-false}
      # workout module: the worker runs workout_reconcile jobs.
      WORKOUT_ENABLED: ${WORKOUT_ENABLED:-false}
      # food module: the worker runs food_parse jobs.
      FOOD_ENABLED: ${FOOD_ENABLED:-false}
      # money module: the worker runs money_rates jobs.
      MONEY_ENABLED: ${MONEY_ENABLED:-false}
      TASKS_ENABLED: ${TASKS_ENABLED:-false}
      GOALS_ENABLED: ${GOALS_ENABLED:-false}
      TRAVEL_ENABLED: ${TRAVEL_ENABLED:-false}
      HABITS_ENABLED: ${HABITS_ENABLED:-false}
      NOTES_ENABLED: ${NOTES_ENABLED:-false}
      PRACTICE_ENABLED: ${PRACTICE_ENABLED:-false}
      MEDICAL_ENABLED: ${MEDICAL_ENABLED:-false}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      NOW_ENABLED: ${NOW_ENABLED:-false}
      WORKER_ID: ${WORKER_ID:-worker-1}
      # Every job type this binary registers a handler for, except Ani's
      # agent jobs (ani_* and telegram_poll; in production they run in the
      # ani worker, deploy/values-ani-worker-prod.yaml), as docs/CONFIG.md
      # lists them. The demo
      # handlers `echo`/`slow`/`fail` live in src/worker_main.cpp for manual
      # testing — opt them in explicitly when you want them, e.g.:
      #   WORKER_TYPES=account_email,echo,slow,fail
      # (The API job tests drain Redis directly and do NOT rely on this list.)
      WORKER_TYPES: ${WORKER_TYPES:-account_email,email.send,webhook.deliver,fitness_sync,leetcode_sync,food_parse,money_rates,money_parse,money_advisor,tasks_parse,now_media_sweep,files_sweep}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_PRIORITY_TYPES: ${WORKER_PRIORITY_TYPES:-food_parse,money_parse,tasks_parse}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9091}
      WORKER_BRPOP_TIMEOUT: ${WORKER_BRPOP_TIMEOUT:-5}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      SERVICE_NAME: ${SERVICE_NAME:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_FILE: ${CONFIG_FILE:-config/worker.json}
      # The pending-upload sweep (now_media_sweep) deletes objects: the same
      # bucket and credentials as the app.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-life-os/}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - with-worker

  # PostgreSQL database (primary)
  postgres:
    image: postgres:18-alpine
    container_name: life_os_cpp_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=appdb
      # postgres:18 moved its default data dir to /var/lib/postgresql/18/docker
      # and its entrypoint refuses to start with an unused mount at the old
      # path; keep the existing volume by naming the path explicitly.
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
      - ./setup-primary-replication.sh:/docker-entrypoint-initdb.d/99-setup-replication.sh
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=3"
      - "-c"
      - "hot_standby=on"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL read replica (streaming replication from primary)
  postgres_replica:
    image: postgres:18-alpine
    container_name: life_os_cpp_postgres_replica
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PRIMARY_HOST=postgres
      - PRIMARY_PORT=5432
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./setup-replica.sh:/setup-replica.sh
    entrypoint: ["/bin/bash", "/setup-replica.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: life_os_cpp_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis Sentinel (optional, for HA)
  # Each sentinel copies the template config to a writable location before starting,
  # because Sentinel modifies its config file at runtime to persist state.
  redis_sentinel_1:
    image: redis:7-alpine
    container_name: life_os_cpp_redis_sentinel_1
    command: sh -c "cp /etc/redis/sentinel-template.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26379:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel-template.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-sentinel
    healthcheck:
      # Real Sentinel liveness: `sentinel masters` only succeeds against an
      # actual sentinel (a plain redis on :26379 would answer PING but error
      # here), so this catches a misconfigured/non-sentinel process.
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis_sentinel_2:
    image: redis:7-alpine
    container_name: life_os_cpp_redis_sentinel_2
    command: sh -c "cp /etc/redis/sentinel-template.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26380:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel-template.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-sentinel
    healthcheck:
      # Real Sentinel liveness: `sentinel masters` only succeeds against an
      # actual sentinel (a plain redis on :26379 would answer PING but error
      # here), so this catches a misconfigured/non-sentinel process.
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis_sentinel_3:
    image: redis:7-alpine
    container_name: life_os_cpp_redis_sentinel_3
    command: sh -c "cp /etc/redis/sentinel-template.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26381:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel-template.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-sentinel
    healthcheck:
      # Real Sentinel liveness: `sentinel masters` only succeeds against an
      # actual sentinel (a plain redis on :26379 would answer PING but error
      # here), so this catches a misconfigured/non-sentinel process.
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: life_os_cpp_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      # Host 9091 is taken by the worker's health endpoint; expose Prometheus on 9094.
      - "9094:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml
      - prometheus_data:/prometheus
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - with-monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:11.6
    container_name: life_os_cpp_grafana
    ports:
      - "3000:3000"
    environment:
      # !!! SECURITY: set GRAFANA_ADMIN_PASSWORD (in docker/.env.monitoring or
      # your shell) before exposing Grafana anywhere shared. The fallback below
      # is an INSECURE local-only placeholder, NOT a usable default — generate a
      # real one with `openssl rand -base64 24`.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme-local-only}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-monitoring

  # ---- exporters for service-level dashboards (with-monitoring profile) ----

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: life_os_cpp_postgres_exporter
    environment:
      # matches docker-compose.yml's postgres service (user/pass/db/port).
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/appdb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-monitoring

  # Server-side metrics for the READ REPLICA. pg_replication_lag_seconds is
  # only meaningful measured ON the replica; the primary's exporter can't see
  # it. Tied to with-replica (tiny footprint) — Prometheus scrapes it under
  # with-monitoring and tolerates a down target otherwise.
  postgres-replica-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: life_os_cpp_postgres_replica_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_replica:5432/appdb?sslmode=disable"
    depends_on:
      postgres_replica:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-replica

  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0
    container_name: life_os_cpp_redis_exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-monitoring

  # React SPA — built once at image build, served by nginx with /api/*
  # proxied to the `app` container. Visit http://localhost:3001; the
  # backend's :8080 stays available for direct API hits.
  # Opt-in via profile `with-frontend` so plain `make up` stays
  # backend-only (faster cold start, no Node toolchain pulled).
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/moveeeax/life-os-cpp-frontend:latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: life_os_cpp_frontend
    ports:
      - "3001:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-frontend

  # Mailpit — local SMTP catcher for dev. Inbox UI on :8025, SMTP on :1025.
  # No TLS, no auth — point MAIL_SMTP_HOST=mailpit / MAIL_SMTP_PORT=1025
  # / MAIL_ENABLED=true at it. Email never leaves the docker network.
  # DELIBERATELY profile-less (starts with plain `make up`): the account
  # flows (confirm/reset/invite) are part of the core dev loop. If host
  # port 1025/8025 clashes with a local mail agent, add a profile here.
  mailpit:
    image: axllent/mailpit:v1.30
    container_name: life_os_cpp_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Jaeger for distributed tracing (optional)
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: life_os_cpp_jaeger
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-monitoring

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  prometheus_data:
  grafana_data:
