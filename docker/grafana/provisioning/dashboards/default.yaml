apiVersion: 1

providers:
  - name: 'life-os-cpp'
    orgId: 1
    folder: 'life-os-cpp'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      # Walk subdirectories so per-service dashboards stay grouped
      # (life-os-cpp, life-os-cpp-worker, postgres, redis, kafka).
      foldersFromFilesStructure: true
