<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable on a phone: standalone, without the browser's bars. iOS
         reads the apple-* tags and the touch icon, Android the manifest. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b2140" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <title>Life OS</title>
    <!-- Sets the initial theme before first paint to avoid a flash. Kept as an
         external /theme.js (not inline) so the production CSP script-src 'self'
         covers it without a nonce/sha256. No defer/module: it must run before
         the body paints, exactly like the old inline script. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config injected by the deployment (see cpp-frontend chart traceUi); 404 in dev is fine. -->
    <script src="/trace-ui.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
