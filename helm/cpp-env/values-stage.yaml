# ═══════════════════════════════════════════════════════════════
# STAGE preset for the cpp-env umbrella → *.stage.tarassov.me
#
# Snapshot of the live `stage` release (ns env-stage) taken with
# `helm get values stage -n env-stage`. Credentials are NOT in this file (and
# never will be — check-helm-render.sh asserts it renders no non-empty
# credential): chart defaults are empty, so stage takes throwaway secrets via
# --set at deploy (generate them per env, e.g. `openssl rand -hex 32`).
#
# Deploy:
#   helm dependency build ./helm/cpp-env
#   helm upgrade --install stage ./helm/cpp-env -n env-stage --create-namespace \
#     -f helm/cpp-env/values-stage.yaml \
#     --set credentials.dbPassword="$DB_PASS" \
#     --set credentials.redisPassword="$REDIS_PASS" \
#     --set credentials.jwtSecret="$JWT_SECRET" \
#     --set life-os-cpp.externalDatabase.password="$DB_PASS" \
#     --set life-os-cpp.externalRedis.password="$REDIS_PASS" \
#     --set life-os-cpp.auth.jwtSecret="$JWT_SECRET" \
#     --set life-os-cpp-worker.externalDatabase.password="$DB_PASS" \
#     --set life-os-cpp-worker.externalRedis.password="$REDIS_PASS" \
#     --set life-os-cpp-worker.auth.jwtSecret="$JWT_SECRET"
#
# NOTE: image tags below are pinned to the 1.5.3 release (unprefixed —
# release.yml strips the v). Bump the three `image.tag` values to roll a
# newer one.
# ═══════════════════════════════════════════════════════════════

env: stage
baseDomain: tarassov.me

life-os-cpp:
  image:
    tag: "1.12.0"

cpp-frontend:
  image:
    tag: "1.12.0"

life-os-cpp-worker:
  image:
    tag: "1.12.0"
  app:
    baseUrl: https://app.stage.tarassov.me
  worker:
    types: account_email,email.send,webhook.deliver,fitness_sync

# Stage exposes the dev mailbox + traces for QA walkthroughs.
jaeger:
  ingress:
    enabled: true
mailpit:
  ingress:
    enabled: true
