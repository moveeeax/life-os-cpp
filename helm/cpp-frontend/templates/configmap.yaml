apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cpp-frontend.fullname" . }}
  labels:
    {{- include "cpp-frontend.labels" . | nindent 4 }}
data:
  # Overrides the nginx.conf baked into the image. The image hardcodes
  # `proxy_pass http://app:8080` (the docker-compose service name), which does
  # not resolve in Kubernetes — here the /api upstream points at the life-os-cpp
  # Service so the SPA stays the single same-origin entry point (cookies remain
  # first-party). $-prefixed tokens are nginx variables, not Helm.
  default.conf: |
    server {
        # 8080: the image is built FROM nginxinc/nginx-unprivileged, whose
        # master runs as a non-root user and cannot bind privileged ports.
        listen       8080;
        server_name  _;

        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

        # Runtime trace-UI config for the SPA: the image is built once and
        # deployed everywhere, so the "Open trace" target can't be baked in.
        # Must contain {traceId}; e.g. a Grafana Explore deep link. Without a
        # value the script is empty: index.html always requests it, and the
        # SPA fallback would otherwise answer with HTML.
        location = /trace-ui.js {
            default_type application/javascript;
{{- if .Values.traceUi }}
            return 200 'window.__TRACE_UI__={{ .Values.traceUi | quote }};';
{{- else }}
            return 200 '';
{{- end }}
        }

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            # Security headers for the SPA HTML, the same set as
            # frontend/nginx.conf. nginx add_header does not inherit into a
            # location that sets its own, so they are repeated per block.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        }

        location /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Exercise photos of the Workout section, baked into the image. A
        # missing file is a 404, not the SPA page.
        location /exercise-media/ {
            access_log off;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /api/ {
            # Media uploads accept up to 5 MB (the app's upload cap); the nginx
            # default is 1m, which 413s a normal photo before it reaches the
            # backend. 6m leaves headroom for multipart overhead.
            client_max_body_size 6m;
            proxy_pass http://{{ .Values.backend.service }}:{{ .Values.backend.port }};
            proxy_set_header Host              $host;
            # Pass through the X-Real-IP the ingress set (the REAL client) — NOT
            # $remote_addr, which is this hop's peer (the ingress pod) and would
            # clobber the client IP the backend audits. When there's no upstream
            # header (reached directly, not via ingress) this is empty and nginx
            # omits it, so the backend falls back to X-Forwarded-For / peer.
            proxy_set_header X-Real-IP         $http_x_real_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

    }
