apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cpp-frontend.fullname" . }}
  labels:
    {{- include "cpp-frontend.labels" . | nindent 4 }}
data:
  # Overrides the nginx.conf baked into the image. The image hardcodes
  # `proxy_pass http://app:8080` (the docker-compose service name), which does
  # not resolve in Kubernetes — here the /api upstream points at the life-os-cpp
  # Service so the SPA stays the single same-origin entry point (cookies remain
  # first-party). $-prefixed tokens are nginx variables, not Helm.
  default.conf: |
    server {
        # 8080: the image is built FROM nginxinc/nginx-unprivileged, whose
        # master runs as a non-root user and cannot bind privileged ports.
        listen       8080;
        server_name  _;

        # No nginx version in the Server header or on error pages.
        server_tokens off;

        # Client address. The ingress controller in front sets X-Real-IP to the
        # address it received the connection from; nginx takes that header as
        # $remote_addr ONLY when the connection comes from realIp.trustedProxies
        # (the ingress pods). From anywhere else the header is ignored and
        # $remote_addr stays the real peer, so a caller that reaches this pod
        # directly cannot choose the IP the API rate-limits and audits.
{{- range .Values.realIp.trustedProxies }}
        set_real_ip_from {{ . }};
{{- end }}
        real_ip_header    X-Real-IP;
        real_ip_recursive off;

        # Compress the text the SPA is made of (index.html is always in
        # gzip_types). gzip_proxied any: every request arrives through the
        # ingress, and API JSON from the backend is compressed here too.
        gzip            on;
        gzip_vary       on;
        gzip_proxied    any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

        # Runtime trace-UI config for the SPA: the image is built once and
        # deployed everywhere, so the "Open trace" target can't be baked in.
        # Must contain {traceId}; e.g. a Grafana Explore deep link. Without a
        # value the script is empty: index.html always requests it, and the
        # SPA fallback would otherwise answer with HTML.
        location = /trace-ui.js {
            default_type application/javascript;
{{- if .Values.traceUi }}
            return 200 'window.__TRACE_UI__={{ .Values.traceUi | quote }};';
{{- else }}
            return 200 '';
{{- end }}
        }

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            # Security headers for the SPA HTML, the same set as
            # frontend/nginx.conf. nginx add_header does not inherit into a
            # location that sets its own, so they are repeated per block.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # csp.storageHosts: the wallpaper bucket or its CDN (pictures,
            # videos and the admin's direct upload); docs/wallpapers.md. blob: lets
            # the upload page read the picked file for its poster and size.
            {{- $storage := join " " .Values.csp.storageHosts }}
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: {{ $storage }}; media-src 'self' blob: {{ $storage }}; font-src 'self'; connect-src 'self' {{ $storage }}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        }

        location /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Exercise photos of the Workout section, baked into the image. A
        # missing file is a 404, not the SPA page.
        location /exercise-media/ {
            access_log off;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /api/ {
            # Media uploads accept up to 5 MB (the app's upload cap); the nginx
            # default is 1m, which 413s a normal photo before it reaches the
            # backend. 6m leaves headroom for multipart overhead.
            client_max_body_size 6m;
            proxy_pass http://{{ .Values.backend.service }}:{{ .Values.backend.port }};
            proxy_set_header Host              $host;
            # $remote_addr after the real_ip step above: the ingress's X-Real-IP
            # when the request came through a trusted proxy, else the actual
            # peer. Never the raw client-supplied header.
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

    }
