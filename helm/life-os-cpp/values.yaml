# ---------------------------------------------------------------
# Deployment — number of pod replicas and container image settings
# ---------------------------------------------------------------
replicaCount: 1

image:
  repository: ghcr.io/moveeeax/life-os-cpp
  tag: ""  # Defaults to chart appVersion
  pullPolicy: IfNotPresent

# List of Kubernetes secrets for pulling from private registries
imagePullSecrets: []
# Override the generated resource names (leave empty to use chart defaults)
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------
# Networking — Kubernetes Service and Ingress
# ---------------------------------------------------------------
service:
  type: ClusterIP          # ClusterIP | NodePort | LoadBalancer
  httpPort: 8080           # Main API port (matches SERVER_PORT)
  metricsPort: 9090        # Prometheus metrics port (matches METRICS_ADDRESS)

ingress:
  enabled: false
  className: ""            # e.g. "nginx", "traefik"
  annotations: {}          # Free-form extra annotations
  # cert-manager convenience — set one of clusterIssuer/issuer, the template
  # will render the matching annotation automatically. Leave both empty if
  # you're using something other than cert-manager (or managing TLS manually).
  certManager:
    clusterIssuer: ""      # e.g. "letsencrypt-prod"
    issuer: ""             # namespaced Issuer name (mutually exclusive with clusterIssuer)
  hosts:
    - host: life-os-cpp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Full cert-manager example — cert-manager watches this Secret name and
  # populates it from the ClusterIssuer above. Uncomment and set both.
  #   certManager.clusterIssuer: letsencrypt-prod
  #   tls:
  #     - secretName: life-os-cpp-tls
  #       hosts:
  #         - api.example.com

# ---------------------------------------------------------------
# Resource requests/limits and scaling
# ---------------------------------------------------------------
# Starting point — MEASURE under your own load. A Drogon app with libpqxx +
# redis++ connection pools under traffic can exceed 256Mi and get OOMKilled;
# these defaults err on the safe side. Tune requests to your steady state and
# limits to your peak.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Horizontal Pod Autoscaler — requires metrics-server in the cluster
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget — ensures minimum available pods during voluntary disruptions
pdb:
  enabled: false
  minAvailable: 1

# ---------------------------------------------------------------
# Network policy — restrict ingress/egress when enabled.
#
# Ships with `enabled: false` because the selectors below hardcode
# namespace names (ingress-nginx, monitoring, db) that vary per cluster.
# Before flipping to true in production:
#   1. Confirm your ingress-controller namespace and update fromSelectors.
#   2. Confirm where Postgres/Redis live; list egress targets by
#      podSelector or namespaceSelector (not CIDR — it ties the manifest
#      to a single environment).
#   3. Test in a staging namespace first — a wrong NetworkPolicy silently
#      blackholes traffic.
# ---------------------------------------------------------------
networkPolicy:
  enabled: false
  ingress:
    fromSelectors:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
    metricsFromSelectors:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
  egress:
    extra:
      # Allow egress to Postgres, Redis by namespace/podSelector as appropriate.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: db
        ports:
          - port: 5432
            protocol: TCP
          - port: 6379
            protocol: TCP
          - port: 26379   # Redis Sentinel; drop when externalRedis.useSentinel=false
            protocol: TCP

# ---------------------------------------------------------------
# Prometheus ServiceMonitor (requires prometheus-operator CRDs)
# ---------------------------------------------------------------
serviceMonitor:
  enabled: false           # Set to true if Prometheus Operator is installed
  interval: 30s            # Scrape interval
  path: /metrics           # Metrics endpoint path on metricsPort

# ---------------------------------------------------------------
# Alerting — PrometheusRule objects with baseline SLO alerts.
# Requires prometheus-operator CRDs (alertsEnabled=true to render).
# Tune thresholds per service; these defaults are deliberately tight so
# "the chart shipped without alerts" never happens.
# ---------------------------------------------------------------
monitoring:
  alertsEnabled: false
  jobsAlerts: false         # Include jobs/DLQ alerts (requires Jobs enabled)
  alertLabels: {}           # Extra labels applied to every rule (e.g. team)
  # Selector used on every PromQL expression. Must match how your cluster's
  # ServiceMonitor / scrape relabel config labels targets. Common shapes:
  #   prometheus-operator default →  job="{namespace}/{service}/{port}"
  #                                  → set targetSelector: "namespace=\"my-ns\", service=\"{fullname}\""
  #   simple ServiceMonitor        →  job="{service}"
  #                                  → set targetSelector: "job=\"{fullname}\""
  # Default picks service="{fullname}" which works if you keep the label in
  # relabel_configs. If in doubt, open Prometheus → Targets and look at the
  # actual label set on your pod.
  targetSelector: ""
  # The numbers follow the table in docs/SLO.md (the same rules run in
  # docker/prometheus-rules.yml for the compose stack); change both places.
  thresholds:
    errorRate: 0.05                 # Fraction of 5xx that fires High5xxRate (5 % for 5m)
    latencyP99Sec: 1                # HighP99Latency: p99 seconds (10m)
    dlqDepth: 0                     # DeadLetterQueueGrowing: total jobs_dlq_depth above this for 15m
    queueDepth: 100                 # JobsQueueBacklog: total jobs_queue_depth above this for 10m
    dbPoolSaturation: 0.9           # DbPoolSaturationHigh: active/size ratio above this (90 %)
    replicaLagSec: 60               # ReplicationLagHigh: read-replica lag in seconds
    dlqPerTypeDepth: 5              # DeadLetterQueueSpikeByType: one type's DLQ depth
    retriesExhaustedPerSec: 0.1     # RetriesExhaustedSpike: exhausted retries per second, sustained 5m

# ---------------------------------------------------------------
# External Secrets Operator — pull secrets from Vault / AWS SSM / GCP SM
# instead of inlining them in values. When enabled, the static Secret
# rendered by templates/secret.yaml is suppressed and the Deployment
# consumes the ExternalSecret-materialized Secret instead.
# ---------------------------------------------------------------
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef:
    name: ""                  # cluster's SecretStore / ClusterSecretStore name
    kind: ClusterSecretStore  # or SecretStore (namespaced)
  data: []
    # - secretKey: database-password
    #   remoteRef: { key: prod/app/db, property: password }
    # - secretKey: redis-password
    #   remoteRef: { key: prod/app/redis, property: password }
    # - secretKey: jwt-secret
    #   remoteRef: { key: prod/app/auth, property: jwt_secret }

# ---------------------------------------------------------------
# External PostgreSQL connection
# Env vars set: DATABASE_PRIMARY_URL, DATABASE_REPLICA_URLS,
#               DB_POOL_SIZE, DB_MIGRATIONS_ENABLED
# ---------------------------------------------------------------
externalDatabase:
  host: postgres.example.svc.cluster.local
  port: 5432
  name: appdb
  user: appuser
  password: ""  # Set via --set or external secret
  poolSize: 10
  replicaHost: ""  # e.g. postgres-ro.example.svc.cluster.local — leave empty to disable replicas
  # Run migrations in the main container on startup.
  # Prefer false + migrations.runAsInitContainer=true to avoid every replica
  # racing to apply migrations at rollout time.
  migrationsEnabled: false

# ---------------------------------------------------------------
# Schema migrations — run as an init container so only one pod per rollout
# applies migrations, rather than every replica racing at startup.
# ---------------------------------------------------------------
migrations:
  runAsInitContainer: true

# ---------------------------------------------------------------
# External Redis / Sentinel connection
# Env vars set: REDIS_URL, REDIS_PASSWORD, REDIS_USE_SENTINEL,
#               REDIS_MASTER_NAME, REDIS_SENTINEL_NODES, CACHE_POOL_SIZE
# ---------------------------------------------------------------
externalRedis:
  url: "tcp://redis.example.svc.cluster.local:6379"  # Fallback if sentinel disabled
  password: ""  # Set via --set or external secret
  useSentinel: true                                  # Enable Sentinel HA mode
  masterName: mymaster                               # Sentinel master name
  # Comma-separated list of sentinel host:port. Adjust to your cluster's
  # sentinel service.
  sentinelNodes: "redis-node-0.redis-headless.example.svc.cluster.local:26379,redis-node-1.redis-headless.example.svc.cluster.local:26379,redis-node-2.redis-headless.example.svc.cluster.local:26379"
  poolSize: 10
  # Logical Redis DB index. 0 = chart default, safe when this Redis instance
  # isn't shared with another app. MUST be set (and match the other release's
  # value — api and worker share the queue) whenever it is shared.
  db: 0

# ---------------------------------------------------------------
# Jobs configuration (disabled on the API by default — use life-os-cpp-worker chart)
# Env vars set: JOBS_ENABLED, JOBS_RESULT_TTL, JOBS_MAX_RETRIES,
# JOBS_RETRY_BACKOFF_BASE_MS
# ---------------------------------------------------------------
jobs:
  enabled: false
  resultTtl: 86400
  maxRetries: 3
  # Delay before the first retry of a failed job, doubling per retry (capped
  # at 60 s by the app). 0 requeues at once.
  retryBackoffBaseMs: 2000

# ---------------------------------------------------------------
# Transactional outbox (src/jobs/Outbox.hpp). Rows a request writes into the
# outbox table in its own transaction are relayed to the Redis queue by the
# API pod every drainIntervalSec seconds. 0 leaves the relay off and the rows
# sit in Postgres. Needs jobs.enabled=true. Rendered into config.json as
# outbox.drain_interval_sec (OUTBOX_DRAIN_INTERVAL_SEC).
# ---------------------------------------------------------------
outbox:
  drainIntervalSec: 0

# ---------------------------------------------------------------
# fitness module — wired by hand on the new-module.sh pattern (there is
# no content module anchor left for the script to hook). Env var set: FITNESS_ENABLED. The Xiaomi
# credentials and sync knobs (MI_FITNESS_*) come from extraEnvFrom, never
# from chart values.
# ---------------------------------------------------------------
fitness:
  enabled: false

# ---------------------------------------------------------------
# workout module — routines, workout log, links to the fitness data.
# Wired by hand on the same pattern. Env var set: WORKOUT_ENABLED.
# ---------------------------------------------------------------
workout:
  enabled: false

# ---------------------------------------------------------------
# food module — diary, products, goals, Open Food Facts. Env var set: FOOD_ENABLED.
# ---------------------------------------------------------------
food:
  enabled: false

# ---------------------------------------------------------------
# money module — accounts, the ledger, transfers, budgets, reports, rates. Env var set: MONEY_ENABLED.
# ---------------------------------------------------------------
money:
  enabled: false

# ---------------------------------------------------------------
# tasks module — personal tasks, the inbox, the one-phrase capture. Env var set: TASKS_ENABLED.
# ---------------------------------------------------------------
tasks:
  enabled: false

# ---------------------------------------------------------------
# goals module — goals of four kinds with progress and pace. Env var set: GOALS_ENABLED.
# ---------------------------------------------------------------
goals:
  enabled: false

# ---------------------------------------------------------------
# travel module — border crossings, day counters and trips. Env var set: TRAVEL_ENABLED.
# ---------------------------------------------------------------
travel:
  enabled: false

# ---------------------------------------------------------------
# habits module — habits ticked by hand or from Mi Fitness and Training. Env var set: HABITS_ENABLED.
# ---------------------------------------------------------------
habits:
  enabled: false

# ---------------------------------------------------------------
# Self sign-up. true: anyone may register; false: invite-only (POST /api/v1/auth/register
# answers 403 registration_closed, admin invites keep working). Env var set: REGISTRATION_OPEN.
# ---------------------------------------------------------------
registration:
  open: true

# ---------------------------------------------------------------
# notes module — private Markdown notes shaped like tarassov.me posts. Env var set: NOTES_ENABLED.
# ---------------------------------------------------------------
notes:
  enabled: false

# ---------------------------------------------------------------
# practice module — the freelance practice: clients, deals, incomes and
# expenses, a month view. Env var set: PRACTICE_ENABLED.
# ---------------------------------------------------------------
practice:
  enabled: false

# medical module — the family medical archive; its files live under the
# private prefix of storage.s3 (docs/RUNBOOK.md, private files). Env var set: MEDICAL_ENABLED.
# ---------------------------------------------------------------
medical:
  enabled: false

# ---------------------------------------------------------------
# now module — the Now screen's digest, the focus of the day and the
# wallpaper library. Env var set: NOW_ENABLED.
# ---------------------------------------------------------------
now:
  enabled: false

# ---------------------------------------------------------------
# S3-compatible storage of the wallpaper library (docs/wallpapers.md).
# Empty bucket or publicBaseUrl: the wallpaper routes answer 503.
# ---------------------------------------------------------------
storage:
  s3:
    endpoint: ""          # https://storage.example.com
    region: ""
    bucket: ""
    prefix: "life-os/"
    publicBaseUrl: ""     # bucket or CDN origin the browser reads from
    pathStyle: true       # endpoint/bucket/key; false: bucket.endpoint-host/key
    credentialsSecret:
      name: ""            # secret holding the access key pair
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key

# ---------------------------------------------------------------
# billing module — generated by scripts/new-module.sh; same on/off
# pattern as Jobs above. Env vars set: BILLING_ENABLED, PAYPAL_ENV,
# PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET (via the chart Secret),
# PAYPAL_WEBHOOK_ID, PAYPAL_RETURN_URL, PAYPAL_CANCEL_URL.
# clientSecret MUST stay empty here — deploys pass it via --set or an
# external secret (scripts/check-helm-render.sh asserts no tracked overlay
# renders a non-empty credential Secret).
# ---------------------------------------------------------------
billing:
  enabled: false
  currency: USD
  creditsPerUnit: 100
  minAmountCents: 100
  maxAmountCents: 100000
  paypal:
    environment: sandbox   # sandbox | live
    clientId: ""
    clientSecret: ""       # Set via --set or external secret (sourced into PAYPAL_CLIENT_SECRET)
    webhookId: ""
    returnUrl: ""
    cancelUrl: ""


# ---------------------------------------------------------------
# Rate limiting — Redis-backed throttle applied by the middleware chain
# (notably on /api/auth/login). The C++ code defaults RATE_LIMIT_ENABLED to
# FALSE, so this MUST be set true in prod or every pod runs unthrottled.
# fail_open=true means a Redis outage degrades to allow (not block) traffic.
# Keys mirror config.json "rate_limit". Env: RATE_LIMIT_ENABLED,
# RATE_LIMIT_REQUESTS, RATE_LIMIT_WINDOW_SEC, RATE_LIMIT_SCOPE,
# RATE_LIMIT_TRUST_PROXY, RATE_LIMIT_TRUSTED_PROXY_COUNT, RATE_LIMIT_FAIL_OPEN,
# RATE_LIMIT_WHITELIST, RATE_LIMIT_AUTH_FAIL_REQUESTS,
# RATE_LIMIT_AUTH_FAIL_WINDOW_SEC, RATE_LIMIT_LOGIN_EMAIL_REQUESTS,
# RATE_LIMIT_LOGIN_EMAIL_WINDOW_SEC
# ---------------------------------------------------------------
rateLimit:
  enabled: false           # set true in prod (values-prod.yaml does)
  requests: 60             # allowed requests per window
  windowSec: 60            # sliding window length in seconds
  # Rejected credentials (unknown API key, forged JWT) per client IP; past the
  # budget a request with credentials gets 429 before the key lookup.
  authFailRequests: 20
  authFailWindowSec: 60
  # Failed logins per email address, from any IP.
  loginEmailRequests: 5
  loginEmailWindowSec: 900
  scope: ip_or_user        # ip | user | ip_or_user
  # Behind an ingress/proxy, set trustProxy=true and trustedProxyCount to the
  # number of proxies in front so the real client IP is taken from
  # X-Forwarded-For instead of the proxy's address.
  trustProxy: false
  trustedProxyCount: 1
  failOpen: true           # Redis down → allow (don't blackhole) requests
  whitelist: ""            # comma-separated IPs/subjects exempt from limiting

# ---------------------------------------------------------------
# Security headers. hsts=true adds Strict-Transport-Security to the API's
# responses (SECURITY_HSTS); only meaningful behind TLS, so the chart default
# is off and production turns it on. Rendered into config.json.
# ---------------------------------------------------------------
security:
  hsts: false
  hstsMaxAge: 31536000

# ---------------------------------------------------------------
# API docs UI (/api/v1/docs + /api/v1/openapi.yaml). Off: the Swagger UI
# exposes the whole surface. Rendered into config.json as docs.enabled;
# scripts/check-helm-render.sh refuses a production render with it on.
# ---------------------------------------------------------------
docs:
  enabled: false

# ---------------------------------------------------------------
# Idempotency — de-duplicates retried mutating requests carrying an
# Idempotency-Key header (Redis-backed). The C++ code defaults
# IDEMPOTENCY_ENABLED to FALSE; set true in prod to make POST retries safe.
# Keys mirror config.json "idempotency". Env: IDEMPOTENCY_ENABLED,
# IDEMPOTENCY_TTL_SEC, IDEMPOTENCY_LOCK_TTL_SEC, IDEMPOTENCY_MAX_BODY_KB,
# IDEMPOTENCY_MAX_RESPONSE_KB
# ---------------------------------------------------------------
idempotency:
  enabled: false           # set true in prod to enable retry de-duplication
  ttlSec: 86400            # how long a stored response is replayed (1 day)
  lockTtlSec: 30           # lock TTL while the first request is in flight
  maxBodyKb: 1024          # skip caching requests with bodies above this
  maxResponseKb: 256       # skip caching responses above this

# ---------------------------------------------------------------
# Application configuration
# Env vars set: LOG_LEVEL, LOG_NAME, SERVICE_NAME, SERVER_THREADS
# ---------------------------------------------------------------
logging:
  level: info              # trace | debug | info | warn | error | critical
  name: life_os_cpp            # Logger name (LOG_NAME)
  format: json             # text | json (LOG_FORMAT) — json required for log aggregators
  serviceName: life_os_cpp_service  # OpenTelemetry service name (SERVICE_NAME)

server:
  threads: 4               # Drogon event-loop threads (SERVER_THREADS)

# ---------------------------------------------------------------
# Auth — AUTH_MODE + JWT signing + session cookies.
# IMPORTANT: login (mint_session) REQUIRES a non-empty jwtSecret even when
# mode=none — without it the API returns "Could not mint session". Set
# mode=jwt to also enforce auth on protected routes, and cookies.enabled=true
# so login actually sets the __Host-* cookies the SPA relies on.
# Keep jwtSecret/issuer/audience in sync with the life-os-cpp-worker chart (it signs
# the same transactional-email link tokens).
# Env: AUTH_MODE, JWT_SECRET, JWT_ISSUER, JWT_AUDIENCE, AUTH_COOKIES_ENABLED,
#      AUTH_COOKIE_SECURE, AUTH_COOKIE_SAMESITE, SECURITY_CSRF_ENABLED
# ---------------------------------------------------------------
auth:
  mode: jwt            # none | bearer | jwt — default jwt so a bare subchart install never ships a public API; an empty jwtSecret then fail-closes at boot
  jwtSecret: ""        # HS256 signing key — set via --set auth.jwtSecret=...
  jwtIssuer: ""
  jwtAudience: ""
  cookies:
    enabled: false     # true → login sets __Host-access / __Host-refresh
    secure: true       # required for __Host- cookies (must be served over HTTPS)
    samesite: Lax
    # Cookie names. Must match the SPA expectation (__Host-* prefix). NOTE: the
    # __Host- prefix REQUIRES secure=true — with secure=false a __Host- cookie is
    # silently dropped by the browser. If you must run cookies over plain HTTP in
    # dev, rename these (e.g. "access" / "refresh") AND set secure=false together.
    access: __Host-access
    refresh: __Host-refresh
  # CSRF double-submit token (SECURITY_CSRF_ENABLED). Enable together with
  # cookies in production — the app warns at boot when cookies are on and this
  # is off. The SPA already echoes the csrf-token cookie on mutations.
  csrf:
    enabled: false

# ---------------------------------------------------------------
# Application — public URL/name the API renders into transactional email links
# when it sends inline (jobs disabled). Keep aligned with the life-os-cpp-worker chart,
# which renders the same links when MAIL_VIA_JOBS routes sends through the queue.
# Env vars set: APP_BASE_URL, APP_NAME
# ---------------------------------------------------------------
app:
  env: production      # APP_ENV — arms the boot-time prod-safety guard (refuses auth.mode=none in prod)
  baseUrl: "https://app.example.com"  # base for confirm/reset links in emails
  name: App

# ---------------------------------------------------------------
# Mail — with jobs.enabled=false (the API default) the API delivers
# transactional email INLINE on the request thread, so it needs the same SMTP
# config the worker would otherwise use. With jobs.enabled=true the API only
# enqueues and the life-os-cpp-worker chart does the delivery — leave mail.enabled here
# as you see fit but set mail.viaJobs=true so the API enqueues instead of
# sending inline.
# Env vars set: MAIL_ENABLED, MAIL_VIA_JOBS, MAIL_SMTP_HOST, MAIL_SMTP_PORT,
#               MAIL_SMTP_USERNAME, MAIL_SMTP_PASSWORD, MAIL_SMTP_USE_TLS,
#               MAIL_FROM, MAIL_FROM_NAME, MAIL_SUBJECT_PREFIX
# ---------------------------------------------------------------
mail:
  enabled: false
  viaJobs: false   # standalone API sends inline; set true when running life-os-cpp-worker
  smtpHost: smtp.example.com
  smtpPort: 587
  smtpUsername: ""
  smtpPassword: ""  # Set via --set or external secret (sourced into MAIL_SMTP_PASSWORD)
  smtpUseTls: true
  from: noreply@example.com
  fromName: App
  subjectPrefix: "[App] "

# ---------------------------------------------------------------
# Graceful shutdown
#   terminationGracePeriodSeconds — total time kubelet waits before SIGKILL.
#                                   Must cover preStopDelay + in-flight work.
#   preStopDelay                  — sleep in preStop hook before SIGTERM is sent,
#                                   giving endpoints controller time to remove
#                                   the pod from Service backends.
#   shutdownPreStopDelaySec       — additional in-process drain the app performs
#                                   between "readiness=503" and "stop accepting"
#                                   (passed through to SHUTDOWN_PRE_STOP_DELAY_SEC).
# ---------------------------------------------------------------
shutdown:
  terminationGracePeriodSeconds: 30
  preStopDelay: 5           # seconds
  shutdownPreStopDelaySec: 5 # seconds

# ---------------------------------------------------------------
# Startup probe — guards the cold start of the C++ binary (and, when the
# migrate init-container is disabled, in-process migrations) so the liveness
# probe doesn't begin counting failures until the process is actually up.
# failureThreshold * periodSeconds bounds the allowed startup window
# (default 30 * 5s = 150s). Hits the same /healthz endpoint as liveness.
# ---------------------------------------------------------------
startupProbe:
  enabled: true
  path: /healthz
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 3

# ---------------------------------------------------------------
# Tracing — OpenTelemetry OTLP exporter
# Env var set: OTLP_ENDPOINT
# ---------------------------------------------------------------
tracing:
  enabled: false
  otlpEndpoint: ""  # e.g. "http://jaeger-collector.observability:4318/v1/traces"

# ---------------------------------------------------------------
# Pod scheduling — annotations, node selection, tolerations, affinity
# ---------------------------------------------------------------
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------
# Secret rotation. The pod template hashes the ConfigMap, so a values change
# rolls the pods, but the credentials arrive through extraEnvFrom from a
# Secret the chart does not render (life-os-app in production): rotating a
# key in that Secret changes nothing in the template, and the running pods
# keep the old value until something restarts them. The checksum/extra-env
# annotation covers the names of the extraEnvFrom sources plus this string:
# after rotating a secret, bump it (a date or a counter) and upgrade, and
# every pod restarts with the new values. Same knob on the worker chart.
# ---------------------------------------------------------------
secretsVersion: ""

# ---------------------------------------------------------------
# Ani's agent and Telegram knobs, taken from a Secret one key at a time (in
# production life-os-ani-agent), not as a whole through extraEnvFrom: that
# Secret also holds the upstream model key (ANI_AGENT_UPSTREAM_KEY) and the
# proxy URL, which only the ani worker uses. Every key is optional; a key the
# Secret lacks keeps its default. scripts/check-helm-render.sh fails when the
# code reads an ANI_AGENT_* or ANI_TELEGRAM_* variable this list misses.
# Empty name: nothing is rendered.
# ---------------------------------------------------------------
aniAgentSecret:
  name: ""
  keys:
    - ANI_AGENT_ENABLED
    - ANI_AGENT_IMAGE
    - ANI_AGENT_KEEPER_IMAGE
    - ANI_AGENT_NAMESPACE
    - ANI_AGENT_NODE_LABEL
    - ANI_AGENT_MAX_RUNNING
    - ANI_AGENT_IDLE_MINUTES
    - ANI_AGENT_MAX_HOURS
    - ANI_AGENT_MODEL
    - ANI_AGENT_UPSTREAM_URL
    - ANI_AGENT_API_URL
    - ANI_AGENT_MONTHLY_TOKENS
    - ANI_TELEGRAM_URL
    - ANI_TELEGRAM_TOKEN

# ---------------------------------------------------------------
# Postgres logical backup (pg_dump → S3-compatible storage)
# Off by default. STARTER-grade: fine to a few GB; past that move to
# pgBackRest / WAL-G for incremental + PITR. Restore is manual — see
# docs/RUNBOOK.md. Rendered by templates/backup-cronjob.yaml.
# ---------------------------------------------------------------
backup:
  enabled: false
  schedule: "0 2 * * *"        # daily 02:00 UTC
  # REQUIRED: an image with BOTH `pg_dump` and the `aws` CLI on PATH — the job
  # runs read-only-rootfs as non-root, so installing tools at runtime is NOT an
  # option. postgres:16-alpine ships pg_dump but NOT aws; amazon/aws-cli ships
  # aws but NOT pg_dump — either alone fails silently. Build a tiny image that
  # bundles both (postgres-client + aws-cli) and set backup.image to it before
  # enabling. The postgres:16-alpine default below covers the pg_dump half so
  # `helm template` renders; override it for a working backup.
  image: postgres:16-alpine
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 3600
  dbPasswordSecret:
    name: ""   # defaults to the chart's secret; set when using ExternalSecrets
    key: database-password
  s3:
    bucket: ""                 # REQUIRED when enabled
    prefix: "life-os-cpp/"
    region: ""
    endpoint: ""               # set for MinIO / non-AWS S3
    credentialsSecret:
      name: ""                 # secret holding access-key-id / secret-access-key
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# ---------------------------------------------------------------
# Off-cluster copy of the database backups (templates/backup-mirror-cronjob.yaml).
# The CNPG barman store of production sits on the cluster's own MinIO, so a
# lost cluster loses the data and its backups together (docs/RUNBOOK.md
# "Backups"). This CronJob runs `rclone <mode>` from that bucket to a bucket
# somewhere else. Off by default: it needs a destination bucket and two
# credential Secrets in this namespace (a Secret of another namespace cannot
# be mounted; copy the MinIO backup credentials into this one).
#   mode: copy  — adds new objects, never deletes at the destination (a wiped
#                 source cannot wipe the copy; apply retention on the
#                 destination bucket with a lifecycle rule).
#   mode: sync  — mirrors deletions too; the copy equals the source.
# The pod runs as 1000 with a read-only root; rclone keeps its state in /tmp.
# ---------------------------------------------------------------
backupMirror:
  enabled: false
  schedule: "30 1 * * *"       # daily, after the 00:00 UTC base backup has landed
  image: rclone/rclone:1.70.3
  mode: copy                   # copy | sync
  extraArgs: []                # e.g. ["--transfers", "8", "--bwlimit", "20M"]
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 7200
  source:
    endpoint: ""               # REQUIRED: http://minio.minio.svc.cluster.local:9000
    provider: Minio            # rclone s3 provider name: Minio, AWS, Other, ...
    region: ""
    bucket: ""                 # REQUIRED
    prefix: ""                 # e.g. cnpg/
    pathStyle: true
    credentialsSecret:
      name: ""                 # REQUIRED: Secret in this namespace
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
  destination:
    endpoint: ""               # empty for AWS S3, otherwise the provider's endpoint
    provider: AWS
    region: ""
    bucket: ""                 # REQUIRED
    prefix: ""
    pathStyle: false
    credentialsSecret:
      name: ""                 # REQUIRED
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
