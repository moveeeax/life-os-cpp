# ---------------------------------------------------------------
# Deployment — number of pod replicas and container image settings
# ---------------------------------------------------------------
replicaCount: 1

image:
  # The worker image, NOT the API one — Makefile pushes it as <name>-worker.
  repository: ghcr.io/moveeeax/life-os-cpp-worker
  tag: ""  # Defaults to chart appVersion
  pullPolicy: IfNotPresent

# Init container that holds the worker until the database schema carries every
# migration of this version (the API release migrates; the worker must not run
# new code against the old schema). It runs `life_os_cpp --verify-migrations`
# from the API image — same tag as the worker unless schemaWait.image.tag is
# set — every intervalSeconds, and fails the pod after timeoutSeconds.
schemaWait:
  enabled: true
  image:
    repository: ghcr.io/moveeeax/life-os-cpp
    tag: ""  # Defaults to image.tag, then the chart appVersion
  timeoutSeconds: 600
  intervalSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# List of Kubernetes secrets for pulling from private registries
imagePullSecrets: []
# Override the generated resource names (leave empty to use chart defaults)
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------
# Networking — Kubernetes Service (health + metrics only, no HTTP)
# ---------------------------------------------------------------
service:
  type: ClusterIP
  healthPort: 9091           # Worker health check port
  metricsPort: 9090          # Prometheus metrics port

# ---------------------------------------------------------------
# Resource requests/limits and scaling
# ---------------------------------------------------------------
# Starting point — MEASURE under your own job load (a busy worker holds the
# same pqxx/redis++ pools as the app). Tune to your throughput.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Horizontal Pod Autoscaler — requires metrics-server in the cluster
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget — ensures minimum available pods during voluntary disruptions
pdb:
  enabled: false
  minAvailable: 1

# ---------------------------------------------------------------
# Prometheus ServiceMonitor (requires prometheus-operator CRDs)
# ---------------------------------------------------------------
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

# ---------------------------------------------------------------
# Alerting — PrometheusRule objects with baseline SLO alerts.
# Requires prometheus-operator CRDs (alertsEnabled=true to render).
# Mirrors the life-os-cpp monitoring block; separate so worker alerts can
# be tuned independently (e.g. different queue thresholds).
# ---------------------------------------------------------------
monitoring:
  alertsEnabled: false
  alertLabels: {}           # Extra labels applied to every rule (e.g. team)
  # Selector used on every PromQL expression. Must match how your cluster's
  # ServiceMonitor / scrape relabel config labels targets.
  targetSelector: ""
  # Same numbers as the life-os-cpp chart and docs/SLO.md.
  thresholds:
    queueDepth: 100                 # total jobs_queue_depth above this warns
    dlqDepth: 0                     # total jobs_dlq_depth above this for 15m
    dlqPerTypeDepth: 5              # single-type DLQ depth that pages
    dbPoolSaturation: 0.9           # db_pool_active/size ratio above this warns (90 %)
    retriesExhaustedPerSec: 0.1     # WorkerRetriesExhaustedSpike: exhausted retries per second, sustained 5m

# ---------------------------------------------------------------
# External Secrets Operator — pull secrets from Vault / AWS SSM / GCP SM
# instead of inlining them in values. When enabled, the static Secret
# rendered by templates/secret.yaml is suppressed and the Deployment
# consumes the ExternalSecret-materialized Secret instead.
# Keep aligned with the life-os-cpp chart — the worker shares the same
# JWT signing key / DB / Redis credentials.
# ---------------------------------------------------------------
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef:
    name: ""                  # cluster's SecretStore / ClusterSecretStore name
    kind: ClusterSecretStore  # or SecretStore (namespaced)
  data: []
    # - secretKey: database-password
    #   remoteRef: { key: prod/app/db, property: password }
    # - secretKey: redis-password
    #   remoteRef: { key: prod/app/redis, property: password }
    # - secretKey: jwt-secret
    #   remoteRef: { key: prod/app/auth, property: jwt_secret }
    # - secretKey: mail-smtp-password
    #   remoteRef: { key: prod/app/mail, property: smtp_password }

# ---------------------------------------------------------------
# Worker settings
# Env vars set: WORKER_ID, WORKER_TYPES, WORKER_CONCURRENCY,
#               WORKER_PRIORITY_TYPES, WORKER_HEALTH_PORT, WORKER_BRPOP_TIMEOUT
# ---------------------------------------------------------------
worker:
  # WORKER_ID names the Redis processing list a job sits in while this
  # instance runs it. Empty (the default) takes the pod name
  # (metadata.name), so two replicas never share a list and a replaced pod
  # never claims another's jobs; a value here pins it (compose keeps
  # worker-1). With a pod-derived id the jobs of a pod that was killed are
  # returned to the queue by the processing lease (jobs.visibilityTimeoutSec),
  # not by the next pod's startup rescue, so set that lease too.
  id: ""
  # Comma-separated queue types the worker pulls from (matches WORKER_TYPES env).
  # MUST include "account_email" (transactional confirm/reset/change-email) and
  # "email.send" (generic ad-hoc email) — a worker that only drains "default"
  # silently leaves those jobs to pile up in Redis and no mail is ever sent.
  types: "account_email,email.send,webhook.deliver,fitness_sync,leetcode_sync,food_parse,money_rates,money_parse,money_advisor,tasks_parse,now_media_sweep,files_sweep"
  concurrency: 2
  # Comma-separated types that also get one thread of their own beside the
  # `concurrency` shared ones (WORKER_PRIORITY_TYPES): jobs a user waits for
  # on screen, so a long job of another type cannot hold them. Empty: none.
  priorityTypes: ""
  healthPort: 9091
  brpopTimeout: 5

# ---------------------------------------------------------------
# Graceful shutdown (for background workers the drain is bounded by
# brpopTimeout — see worker_main.cpp). Give k8s enough grace so in-flight
# jobs can complete cleanly.
# ---------------------------------------------------------------
shutdown:
  terminationGracePeriodSeconds: 60
  preStopDelay: 2         # seconds

# ---------------------------------------------------------------
# Startup probe — guards the cold start of the C++ worker binary so the
# liveness probe doesn't begin counting failures until the process is up.
# failureThreshold * periodSeconds bounds the allowed startup window
# (default 30 * 5s = 150s). Hits the same /healthz endpoint as liveness.
# ---------------------------------------------------------------
startupProbe:
  enabled: true
  path: /healthz
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 3

# ---------------------------------------------------------------
# Jobs configuration
# Env vars set: JOBS_ENABLED, JOBS_RESULT_TTL, JOBS_MAX_RETRIES,
# JOBS_RETRY_BACKOFF_BASE_MS
# ---------------------------------------------------------------
jobs:
  enabled: true
  resultTtl: 86400
  maxRetries: 3
  # Delay before the first retry of a failed job, doubling per retry (capped
  # at 60 s by the app). 0 requeues at once.
  retryBackoffBaseMs: 2000
  # Processing lease in seconds (JOBS_VISIBILITY_TIMEOUT_SEC): a job whose
  # worker died is re-queued once the lease expires. 0 disables the lease
  # and leaves such a job in `processing` forever. The worker renews a
  # running job's lease every third of this, so it bounds how long a dead
  # worker holds a job, not how long a handler may run; production sets 300.
  # scripts/check-helm-render.sh refuses a production render with 0.
  visibilityTimeoutSec: 0

# ---------------------------------------------------------------
# billing module — generated by scripts/new-module.sh; keep in sync
# with the life-os-cpp chart. Env var set: BILLING_ENABLED
# ---------------------------------------------------------------
billing:
  enabled: false

# ---------------------------------------------------------------
# fitness module — keep in sync with the life-os-cpp chart.
# Env var set: FITNESS_ENABLED
# ---------------------------------------------------------------
fitness:
  enabled: false

# ---------------------------------------------------------------
# workout module — keep in sync with the life-os-cpp chart.
# Env var set: WORKOUT_ENABLED
# ---------------------------------------------------------------
workout:
  enabled: false

# ---------------------------------------------------------------
# food module — keep in sync with the life-os-cpp chart. Env var set: FOOD_ENABLED
# ---------------------------------------------------------------
food:
  enabled: false

# ---------------------------------------------------------------
# money module — keep in sync with the life-os-cpp chart. Env var set: MONEY_ENABLED
# ---------------------------------------------------------------
money:
  enabled: false

# ---------------------------------------------------------------
# tasks module — keep in sync with the life-os-cpp chart. Env var set: TASKS_ENABLED
# ---------------------------------------------------------------
tasks:
  enabled: false

# ---------------------------------------------------------------
# goals module — keep in sync with the life-os-cpp chart. Env var set: GOALS_ENABLED
# ---------------------------------------------------------------
goals:
  enabled: false

# ---------------------------------------------------------------
# travel module — keep in sync with the life-os-cpp chart. Env var set: TRAVEL_ENABLED
# ---------------------------------------------------------------
travel:
  enabled: false

# ---------------------------------------------------------------
# habits module — keep in sync with the life-os-cpp chart. Env var set: HABITS_ENABLED
# ---------------------------------------------------------------
habits:
  enabled: false

# ---------------------------------------------------------------
# Self sign-up — keep in sync with the life-os-cpp chart (the worker does not
# serve /register; the knob is here so both charts carry the same env). Env var set: REGISTRATION_OPEN
# ---------------------------------------------------------------
registration:
  open: true

# ---------------------------------------------------------------
# notes module — keep in sync with the life-os-cpp chart. Env var set: NOTES_ENABLED
# ---------------------------------------------------------------
notes:
  enabled: false

# ---------------------------------------------------------------
# practice module — keep in sync with the life-os-cpp chart. Env var set: PRACTICE_ENABLED
# ---------------------------------------------------------------
practice:
  enabled: false

# medical module — keep in sync with the life-os-cpp chart. Env var set: MEDICAL_ENABLED
# ---------------------------------------------------------------
medical:
  enabled: false

# ---------------------------------------------------------------
# now module — keep in sync with the life-os-cpp chart. Env var set: NOW_ENABLED
# ---------------------------------------------------------------
now:
  enabled: false

# ---------------------------------------------------------------
# Wallpaper and sound storage — keep in sync with the life-os-cpp chart.
# The worker's now_media_sweep job deletes the objects of rows left pending.
# Env vars set: S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_PREFIX,
# S3_PUBLIC_BASE_URL, S3_PATH_STYLE, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
# ---------------------------------------------------------------
storage:
  s3:
    endpoint: ""
    region: ""
    bucket: ""
    prefix: "life-os/"
    publicBaseUrl: ""
    pathStyle: true
    credentialsSecret:
      name: ""            # secret holding the access key pair
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key

# ---------------------------------------------------------------
# External PostgreSQL connection
# Env vars set: DATABASE_PRIMARY_URL, DATABASE_REPLICA_URLS, DB_POOL_SIZE,
#               DB_MIGRATIONS_ENABLED
# ---------------------------------------------------------------
externalDatabase:
  host: postgres.example.svc.cluster.local
  port: 5432
  name: appdb
  user: appuser
  password: ""  # Set via --set or external secret
  poolSize: 10
  replicaHost: ""  # e.g. postgres-ro.example.svc.cluster.local — leave empty to disable replicas
  # Keep false on the worker: the life-os-cpp init-container owns schema migrations.
  # Core.hpp defaults this to true, so leaving it unset would make every worker
  # pod race the API for the migration advisory lock at startup.
  migrationsEnabled: false

# ---------------------------------------------------------------
# External Redis / Sentinel connection
# Env vars set: REDIS_URL, REDIS_PASSWORD, REDIS_USE_SENTINEL,
#               REDIS_MASTER_NAME, REDIS_SENTINEL_NODES, CACHE_POOL_SIZE
# ---------------------------------------------------------------
externalRedis:
  url: "tcp://redis.example.svc.cluster.local:6379"
  password: ""  # Set via --set or external secret
  useSentinel: true
  masterName: mymaster
  sentinelNodes: "redis-node-0.redis-headless.example.svc.cluster.local:26379,redis-node-1.redis-headless.example.svc.cluster.local:26379,redis-node-2.redis-headless.example.svc.cluster.local:26379"
  poolSize: 10
  # Logical Redis DB index. 0 = chart default, safe when this Redis instance
  # isn't shared with another app. MUST be set (and match the other release's
  # value — api and worker share the queue) whenever it is shared.
  db: 0

# ---------------------------------------------------------------
# Application configuration
# Env vars set: LOG_LEVEL, LOG_NAME, SERVICE_NAME
# ---------------------------------------------------------------
logging:
  level: info
  name: life_os_cpp_worker
  format: json             # text | json (LOG_FORMAT) — json required for log aggregators
  serviceName: life_os_cpp_worker_service

# ---------------------------------------------------------------
# Tracing — OpenTelemetry OTLP exporter
# Env var set: OTLP_ENDPOINT
# ---------------------------------------------------------------
tracing:
  enabled: false
  otlpEndpoint: ""  # e.g. "http://jaeger-collector.observability:4318/v1/traces"

# ---------------------------------------------------------------
# Auth — the worker signs the tokens embedded in transactional email links
# (confirm / reset / change-email). MUST match the API chart's auth settings,
# otherwise the links the worker mints won't verify against the API.
# Env vars set: AUTH_MODE, JWT_SECRET, JWT_ISSUER, JWT_AUDIENCE
# ---------------------------------------------------------------
auth:
  mode: jwt        # none | bearer | jwt — keep in sync with the life-os-cpp chart
  jwtSecret: ""    # Set via --set or external secret (sourced into JWT_SECRET)
  jwtIssuer: ""
  jwtAudience: ""

# ---------------------------------------------------------------
# Application — public URL the worker renders into email links.
# Env vars set: APP_BASE_URL, APP_NAME
# ---------------------------------------------------------------
app:
  baseUrl: "https://app.example.com"  # base for confirm/reset links in emails
  name: App

# ---------------------------------------------------------------
# Mail — the worker is the component that actually delivers transactional
# email (with MAIL_VIA_JOBS it drains the email job queue and sends).
# Env vars set: MAIL_ENABLED, MAIL_VIA_JOBS, MAIL_SMTP_HOST, MAIL_SMTP_PORT,
#               MAIL_SMTP_USERNAME, MAIL_SMTP_PASSWORD, MAIL_SMTP_USE_TLS,
#               MAIL_FROM, MAIL_FROM_NAME, MAIL_SUBJECT_PREFIX
# ---------------------------------------------------------------
mail:
  enabled: false
  viaJobs: true
  smtpHost: smtp.example.com
  smtpPort: 587
  smtpUsername: ""
  smtpPassword: ""  # Set via --set or external secret (sourced into MAIL_SMTP_PASSWORD)
  smtpUseTls: true
  from: noreply@example.com
  fromName: App
  subjectPrefix: "[App] "

# ---------------------------------------------------------------
# Ani's agents (src/agent/, docs/CONFIG.md "Ani agent"): an OpenClaw pod per
# user in its own namespace. Enabled on the ONE worker release that runs the
# ani_* jobs and serves the pods' model proxy (deploy/values-ani-worker-prod.yaml):
# its pods get a service account bound to a Role in that namespace (pods and
# secrets, nothing else), and the chart renders the namespace with a quota,
# a default-deny network policy and an image pre-puller.
# ---------------------------------------------------------------
aniAgents:
  enabled: false
  namespace: life-os-agents
  # Must match ANI_AGENT_MAX_RUNNING: the quota is a backstop, not the limit.
  maxPods: 8
  # Per pod, as Manifest.hpp sets them (gateway + restore + keeper).
  podMemoryRequest: 1600Mi
  podMemoryLimit: 2400Mi
  # The pods reach this worker's proxy on its health port, and the bucket
  # (restore and keeper) on 443 at these CIDRs; empty: no bucket egress.
  s3Cidrs: []
  prepull:
    enabled: true
    image: ghcr.io/openclaw/openclaw:2026.10.7-slim
    # The node label key the agent pods require (ANI_AGENT_NODE_LABEL).
    nodeLabel: node-role.kubernetes.io/worker

# ---------------------------------------------------------------
# Pod scheduling — annotations, node selection, tolerations, affinity
# ---------------------------------------------------------------
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------
# Secret rotation: the pods hash the ConfigMap, not the Secrets they take
# through extraEnvFrom. After rotating a key in one of those Secrets, bump
# this string (a date or a counter) and upgrade; the checksum/extra-env
# annotation changes and every pod restarts with the new value. Same knob
# on the life-os-cpp chart.
# ---------------------------------------------------------------
secretsVersion: ""

# ---------------------------------------------------------------
# Extra envFrom sources for the app AND the migrate init container:
# DATABASE_PASSWORD rides in the same app Secret, and migrations need it
# too. The escape hatch for app-specific secrets the chart does not know
# about — e.g. the fitness token key and sync knobs (MI_FITNESS_*). Rendered verbatim.
# ---------------------------------------------------------------
extraEnvFrom: []
#  - secretRef:
#      name: life-os-app
