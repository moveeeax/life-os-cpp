name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to a PR supersedes the running check; a push to master never
# cancels the previous master run, so every merged commit gets a full verdict
# (release.yml looks the tagged SHA's CI run up and needs it to finish).
# A pull request keeps one run per branch and cancels the older one. A push to
# master gets its own group per commit: in a shared group GitHub keeps one run
# and one pending, and a newer pending run cancels the older pending one even
# without cancel-in-progress, which left release commits with no CI run and
# release.yml's ci-green check failing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the repo; release/builder-cache workflows declare their own
# write scopes explicitly. pull-requests: read exists solely for the
# self-scoping steps (`gh api .../pulls/N/files` lists the PR's changed
# files) — still no write scope anywhere.
permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # End-to-end: builds the Docker builder stage (which compiles everything
    # with sanitizers and links the test binary), then runs the full gtest
    # suite against ephemeral Postgres + Redis containers via the `test`
    # compose profile — the same thing `make test` does locally.
    # 90, not 60: after a vcpkg baseline bump BOTH cache layers (gha + GHCR)
    # are cold and the ~35-min dependency world rebuilds before a single test
    # runs. A job killed before it exports the gha cache leaves the NEXT run
    # cold too — the timeout must let a cold build finish once.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2  # HEAD^ fallback for the push-event scope diff

      - name: Scope — does the diff touch anything this job builds?
        # Self-scoping, NOT a workflow-level `paths:` filter: the job always
        # STARTS (required-check semantics stay honest — a skipped required
        # job reports success while checking nothing), computes the diff
        # itself, and exits green in seconds when none of its inputs changed.
        # Fail-open: any trouble computing the diff ⇒ run the job in full.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          RELEVANT: '^(src/|tests/|migrations/|docker/|config/|templates/|third_party/|scripts/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|Makefile$|\.github/workflows/ci\.yml$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename') || changed=""
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push: diff the whole push (before..sha), not just its last
            # commit — a multi-commit push would otherwise hide every change
            # but the head's. Fetch the old tip (the checkout is shallow);
            # any failure (force-push to an unreachable SHA) fails open below.
            changed=$(git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" >/dev/null 2>&1 &&
              git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" 2>/dev/null) || changed=""
          else
            # push that created the branch (before is all zeros): first-parent
            # diff of the head (checkout fetched depth 2). HEAD^ is absent on a
            # root commit → fail open below.
            changed=$(git diff --name-only HEAD^..HEAD 2>/dev/null) || changed=""
          fi
          if [ -z "$changed" ]; then
            echo "could not determine the changed files — failing open, job runs in full"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$RELEVANT"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "paths untouched — verified nothing this job covers is affected; exiting green"
          fi

      - name: Free runner disk for the vcpkg build
        # vcpkg writes debug and release libs into the builder layers, and the
        # tree only grows: master run 41201001899 died with "no space left on
        # device" in libprotocd.a and held up the v1.54.0 tag. The removed
        # SDKs (.NET, Android, GHC, CodeQL) are not used by any job here.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Expose Actions cache env for sccache
        # Exports ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN so sccache (inside
        # docker builds and `docker run` compile steps) can talk to the Actions
        # cache API. The Dockerfile receives them as BuildKit secrets — never
        # ARGs — so layer cache keys and image history stay credential-free.
        if: steps.scope.outputs.relevant == 'true'
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124  # v3.1.0

      - name: Build test image
        # The test-runner stage is the builder plus a logs directory and an
        # entrypoint: building it here, under compose's default image name,
        # means the test step runs the binaries as they are. It used to build
        # only the builder stage and let `make test` build test-runner on top,
        # and that second build missed the layer cache (compose passes no
        # ENABLE_WERROR), so the same 325 objects compiled a second time, on
        # two cores and without sccache: 20 minutes of a 25-minute test step,
        # for a suite that runs in 90 seconds (measured 2026-11-01).
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test-runner
          push: false
          load: true
          tags: life-os-cpp:test-latest
          build-args: ENABLE_WERROR=ON
          secrets: |
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Run full test suite
        # `make test-ci` runs the three test binaries on the image loaded
        # above (compose's TEST_IMAGE default) and builds nothing.
        #
        # CI_REQUIRE_INFRA: without it a mis-wired Postgres/Redis sidecar turns
        # all 160+ integration/api cases into SKIPs and the job reports green
        # while checking nothing (the guard existed in test_helpers.hpp but was
        # exported nowhere — downstream bump: tarassov.me 33e108e).
        # docker-compose.yml forwards it into the test-runner container.
        if: steps.scope.outputs.relevant == 'true'
        env:
          CI_REQUIRE_INFRA: "1"
        run: |
          make test-ci

      - name: Dump logs on failure
        if: failure() && steps.scope.outputs.relevant == 'true'
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env \
            --profile test logs test-runner || true

  lint-format:
    runs-on: ubuntu-latest
    # Pure text lint — doesn't need Docker, runs fast, gates style issues
    # before the heavier build job finishes.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install clang-format 17
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17
          sudo ln -sf /usr/bin/clang-format-17 /usr/local/bin/clang-format

      - name: Check C++ formatting
        run: |
          mapfile -t files < <(find src tests -type f \
            \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ sources to check"; exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

      - name: Shellcheck (scripts)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

      - name: Shellcheck (docker)
        # docker/*.sh (Postgres replica setup) lives outside ./scripts. Second
        # invocation keeps the scandir scoping (the action only accepts one
        # scandir).
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: ./docker
          severity: warning

  secret-scan:
    runs-on: ubuntu-latest
    # Catch credentials before they land. We learned the hard way that a
    # local helm/values.yaml with stage passwords can slip into git.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits.
      # The official gitleaks-action requires a PAID license for repos owned by
      # an ORGANIZATION (it hard-fails with "missing gitleaks license", so
      # moving this repo under an org would ship a permanently red gate). The
      # scanner itself is open source, so run the CLI directly: same rules,
      # same .gitleaks.toml, no license and no secrets.
      # Pinned by digest (the v8.21.2 index): a re-pushed tag cannot swap the
      # scanner under the gate.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 detect \
              --source=/repo --config=/repo/.gitleaks.toml \
              --redact --verbose --exit-code 1

  openapi-drift:
    runs-on: ubuntu-latest
    # Pure-shell check — verifies (method, path) tuples in
    # Api::get_endpoints() match docs/openapi.yaml. Runs in seconds, gates
    # the heavier build job from going green if the spec is stale.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # check-openapi-breaking.sh diffs against the merge base with origin/master
      - name: Check OpenAPI drift
        run: ./scripts/check-openapi-drift.sh
      - name: Check tests/e2e/openapi.gen.json is regenerated from docs/openapi.yaml
        run: ./scripts/check-openapi-gen-fresh.sh
      - name: Install oasdiff
        # Pinned by version AND sha256, same discipline as the helm/yq
        # installs below. The checksum is the linux_amd64 line of the
        # release's checksums.txt.
        env:
          OASDIFF_VERSION: 1.33.0
          OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/oasdiff.tgz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tgz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tgz -C /tmp oasdiff
          sudo install -m 0755 /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version
      - name: Check OpenAPI breaking changes (spec vs merge base with master, additive-only)
        run: ./scripts/check-openapi-breaking.sh
      - name: Check routes registered
        run: ./scripts/check-routes-registered.sh
      - name: Check test-bucket filter sync
        run: ./scripts/check-test-buckets.sh
      - name: Check version sync (CMakeLists + helm pins + appVersions vs CHANGELOG)
        run: ./scripts/check-version-sync.sh
      - name: Check frontend nginx configs in sync (compose vs helm)
        run: ./scripts/check-frontend-nginx-sync.sh
      - name: Check module dependency DAG (src/ include edges)
        run: ./scripts/check-module-deps.sh
      - name: Check config key sync (src reads vs config jsons, CONFIG.md, helm env lists)
        run: ./scripts/check-config-sync.sh
      - name: Check changelog fragment format (changelog.d/ — fragments stay optional)
        run: ./scripts/assemble-changelog.sh --check
      - name: Lint OpenAPI spec (spectral; errors fail, warnings are reported)
        run: ./scripts/lint-openapi.sh

  gate-selftest:
    runs-on: ubuntu-latest
    # Proves the nine gate scripts BITE: per gate, copy the subtree it reads,
    # plant a known breakage (counted mutators; a no-op mutation is itself a
    # failure), and require the gate to fail AND name what it found — after
    # first PASSING the untouched copy as a control. A gate only ever run
    # against healthy trees is indistinguishable from `exit 0` (check-test-
    # buckets.sh once scanned only its first directory argument; a downstream
    # gitleaks config once scanned with zero rules). SELF-scoped (never a
    # workflow-level `paths:` filter — a path-skipped required job reports
    # success, which is the disease this job exists to cure): the job always
    # starts, and runs the selftest only when the diff touches where gate
    # mutations live (scripts/, .github/workflows/, helm/, deploy/). Rot insurance for
    # everything else is .github/workflows/gates-nightly.yml — a daily
    # unconditional run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2  # HEAD^ fallback for the push-event scope diff

      - name: Scope — does the diff touch the gates?
        # Same self-scoping contract as the heavy jobs: always start, exit
        # green in seconds when untouched, fail open on any diff trouble.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          RELEVANT: '^(scripts/|helm/|deploy/|\.github/workflows/)'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename') || changed=""
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push: diff the whole push (before..sha), not just its last
            # commit — a multi-commit push would otherwise hide every change
            # but the head's. Fetch the old tip (the checkout is shallow);
            # any failure (force-push to an unreachable SHA) fails open below.
            changed=$(git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" >/dev/null 2>&1 &&
              git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" 2>/dev/null) || changed=""
          else
            # push that created the branch (before is all zeros): first-parent
            # diff of the head (checkout fetched depth 2). HEAD^ is absent on a
            # root commit → fail open below.
            changed=$(git diff --name-only HEAD^..HEAD 2>/dev/null) || changed=""
          fi
          if [ -z "$changed" ]; then
            echo "could not determine the changed files — failing open, job runs in full"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$RELEVANT"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "paths untouched — verified nothing this job covers is affected; exiting green"
          fi

      - name: Install helm + yq
        if: steps.scope.outputs.relevant == 'true'
        # Pinned by version AND sha256: the old `curl get-helm-3 | bash`
        # executed whatever helm's main branch served that minute.
        env:
          HELM_VERSION: v3.22.0
          HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
          YQ_VERSION: v4.44.6
          YQ_SHA256: 0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          helm version --short
          yq --version
      - name: Install oasdiff
        if: steps.scope.outputs.relevant == 'true'
        # Pinned by version AND sha256 (the linux_amd64 line of the
        # release's checksums.txt); without it the two oasdiff selftest
        # cases print SELFTEST SKIP instead of proving the gate bites.
        env:
          OASDIFF_VERSION: 1.33.0
          OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/oasdiff.tgz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tgz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tgz -C /tmp oasdiff
          sudo install -m 0755 /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version
      - name: Gate selftest (33 planted breakages must be caught)
        if: steps.scope.outputs.relevant == 'true'
        run: ./scripts/check-selftest.sh

  runtime-smoke:
    runs-on: ubuntu-latest
    # The release images (runtime / worker-runtime) were never built — let
    # alone started — anywhere in CI: only test-runner and builder are. That is
    # how an image without ca-certificates shipped and every SMTP STARTTLS
    # failed in production only (downstream bump: tarassov.me 83cd86c). Build
    # both runtime targets from cache and prove the shipped binaries load,
    # link, and can see a CA bundle.
    timeout-minutes: 45
    # Explicit bash = `bash -eo pipefail`: the smoke steps pipe `docker run`
    # into tee, and without pipefail a binary that fails to start would be
    # masked by tee's exit 0.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2  # HEAD^ fallback for the push-event scope diff

      - name: Scope — does the diff touch anything this job builds?
        # Self-scoping, NOT a workflow-level `paths:` filter: the job always
        # STARTS (required-check semantics stay honest — a skipped required
        # job reports success while checking nothing), computes the diff
        # itself, and exits green in seconds when none of its inputs changed.
        # Fail-open: any trouble computing the diff ⇒ run the job in full.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          RELEVANT: '^(src/|tests/|migrations/|docker/|config/|templates/|third_party/|scripts/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|Makefile$|\.github/workflows/ci\.yml$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename') || changed=""
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push: diff the whole push (before..sha), not just its last
            # commit — a multi-commit push would otherwise hide every change
            # but the head's. Fetch the old tip (the checkout is shallow);
            # any failure (force-push to an unreachable SHA) fails open below.
            changed=$(git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" >/dev/null 2>&1 &&
              git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" 2>/dev/null) || changed=""
          else
            # push that created the branch (before is all zeros): first-parent
            # diff of the head (checkout fetched depth 2). HEAD^ is absent on a
            # root commit → fail open below.
            changed=$(git diff --name-only HEAD^..HEAD 2>/dev/null) || changed=""
          fi
          if [ -z "$changed" ]; then
            echo "could not determine the changed files — failing open, job runs in full"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$RELEVANT"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "paths untouched — verified nothing this job covers is affected; exiting green"
          fi

      - name: Free runner disk for the vcpkg build
        # vcpkg writes debug and release libs into the builder layers, and the
        # tree only grows: master run 41201001899 died with "no space left on
        # device" in libprotocd.a and held up the v1.54.0 tag. The removed
        # SDKs (.NET, Android, GHC, CodeQL) are not used by any job here.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Expose Actions cache env for sccache
        # Exports ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN so sccache (inside
        # docker builds and `docker run` compile steps) can talk to the Actions
        # cache API. The Dockerfile receives them as BuildKit secrets — never
        # ARGs — so layer cache keys and image history stay credential-free.
        if: steps.scope.outputs.relevant == 'true'
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124  # v3.1.0

      - name: Build app runtime image
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: life-os-cpp-ci:runtime-ci
          build-args: ENABLE_WERROR=ON
          secrets: |
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build worker runtime image
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: worker-runtime
          push: false
          load: true
          tags: life-os-cpp-ci-worker:runtime-ci
          build-args: ENABLE_WERROR=ON
          secrets: |
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Runtime images resolve every shared library
        # ldd exits 0 even when a DT_NEEDED entry is missing, so grep the
        # output. Also assert the CA bundle is present: without it every
        # outbound TLS (SMTP STARTTLS, S3) fails at runtime only.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          check_image() {
            image="$1"; binary="$2"
            echo "── $image (/app/$binary)"
            docker run --rm --entrypoint /bin/sh "$image" -c "ldd /app/$binary" | tee ldd.txt
            if grep -q 'not found' ldd.txt; then
              echo "::error::$image: unresolved shared library — runtime-base is missing a package"
              exit 1
            fi
            docker run --rm --entrypoint /bin/sh "$image" -c \
              'test -s /etc/ssl/certs/ca-certificates.crt' || {
              echo "::error::$image: no CA bundle — outbound TLS (SMTP/S3) would fail"
              exit 1
            }
          }
          check_image life-os-cpp-ci:runtime-ci life_os_cpp
          check_image life-os-cpp-ci-worker:runtime-ci life_os_cpp_worker

      - name: API runtime binary starts
        # --print-routes returns before any Core init, so no Postgres/Redis is
        # needed and the check still proves the shipped binary loads and runs.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          docker run --rm life-os-cpp-ci:runtime-ci --print-routes | tee routes.txt
          grep -q '/healthz' routes.txt

      - name: API runtime --verify-migrations gates on the schema
        # The worker chart's wait-for-schema init container loops on exactly
        # this command from the API image: it must exit non-zero while the
        # image's migrations are not applied, and 0 once they are.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          docker network create smoke
          # postgres:18-alpine pinned by digest (the index on 2026-10-18), so
          # the smoke runs against the same server until the pin is bumped.
          docker run -d --name smoke-pg --network smoke \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=app \
            postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          # The image's entrypoint first starts a temporary server for the init
          # scripts, stops it, then starts the real one: pg_isready answers the
          # temporary server too, and the connection right after it was refused.
          # The real server is the second "ready to accept connections" line.
          for _ in $(seq 1 90); do
            ready=$(docker logs smoke-pg 2>&1 | grep -c 'database system is ready to accept connections' || true)
            [ "$ready" -ge 2 ] && docker exec smoke-pg pg_isready -U app -d app >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec smoke-pg pg_isready -U app -d app
          app() {
            docker run --rm --network smoke \
              -e DATABASE_HOST=smoke-pg -e DATABASE_USER=app -e DATABASE_PASSWORD=smoke \
              -e DATABASE_NAME=app -e METRICS_ADDRESS= -e OTLP_ENDPOINT= \
              life-os-cpp-ci:runtime-ci "$@" config/config.json
          }
          if app --verify-migrations > before.txt 2>&1; then
            cat before.txt
            echo "::error::--verify-migrations exited 0 on an empty database"
            exit 1
          fi
          cat before.txt
          grep -q 'Pending migrations' before.txt
          app --run-migrations
          app --verify-migrations | tee after.txt
          grep -q 'All migrations applied' after.txt

      - name: Worker runtime binary starts
        # The worker takes no no-op flag: point it at a config that isn't there
        # so it exits non-zero AFTER the startup banner. The banner is what we
        # assert on — reaching it means the dynamic loader and the static
        # initialisers ran inside the runtime image.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          out="$(timeout 120 docker run --rm life-os-cpp-ci-worker:runtime-ci config/no-such-config.json 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'C++ API Worker Starting'

  helm-charts:
    runs-on: ubuntu-latest
    # Render the cpp-env umbrella with CI values and assert deploy-path
    # invariants (ingress<->service port match, MAIL_VIA_JOBS injected,
    # baseDomain expanded, no null ports), then render the real prod releases
    # from deploy/values-*prod.yaml and assert the prod security floor (rate
    # limit fail-closed, CSRF, idempotency, JWT, Secure cookies). No cluster —
    # pure template smoke test. Catches the helm bug class that compile + unit
    # tests cannot.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install helm + yq
        # Pinned by version AND sha256: the old `curl get-helm-3 | bash`
        # executed whatever helm's main branch served that minute.
        env:
          HELM_VERSION: v3.22.0
          HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
          YQ_VERSION: v4.44.6
          YQ_SHA256: 0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          helm version --short
          yq --version
      - name: Validate helm render
        run: ./scripts/check-helm-render.sh

  frontend:
    runs-on: ubuntu-latest
    # Frontend gate — typecheck + lint + production build. Regenerates
    # schema.gen.ts from docs/openapi.yaml and fails if the committed copy
    # is stale (see the "schema.gen.ts up to date" step).
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2  # HEAD^ fallback for the push-event scope diff

      - name: Scope — does the diff touch the frontend?
        # Self-scoping, NOT a workflow-level `paths:` filter: the job always
        # STARTS (required-check semantics stay honest — a skipped required
        # job reports success while checking nothing), computes the diff
        # itself, and exits green in seconds when none of its inputs changed.
        # docs/openapi.yaml is an input: schema.gen.ts is generated from it.
        # Fail-open: any trouble computing the diff ⇒ run the job in full.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          RELEVANT: '^(frontend/|docs/openapi\.yaml$|\.github/workflows/ci\.yml$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename') || changed=""
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push: diff the whole push (before..sha), not just its last
            # commit — a multi-commit push would otherwise hide every change
            # but the head's. Fetch the old tip (the checkout is shallow);
            # any failure (force-push to an unreachable SHA) fails open below.
            changed=$(git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" >/dev/null 2>&1 &&
              git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" 2>/dev/null) || changed=""
          else
            # push that created the branch (before is all zeros): first-parent
            # diff of the head (checkout fetched depth 2). HEAD^ is absent on a
            # root commit → fail open below.
            changed=$(git diff --name-only HEAD^..HEAD 2>/dev/null) || changed=""
          fi
          if [ -z "$changed" ]; then
            echo "could not determine the changed files — failing open, job runs in full"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$RELEVANT"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "paths untouched — verified nothing this job covers is affected; exiting green"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: npm ci --no-audit --no-fund
      - name: Regenerate OpenAPI types
        if: steps.scope.outputs.relevant == 'true'
        run: npm run gen:api
      - name: schema.gen.ts up to date with docs/openapi.yaml
        # gen:api just rewrote schema.gen.ts from the spec. If the committed
        # copy differs, someone changed docs/openapi.yaml without running
        # `make frontend-gen-api` — fail so the stale file can't ride green.
        if: steps.scope.outputs.relevant == 'true'
        run: git diff --exit-code -- src/lib/api/schema.gen.ts
      - name: Typecheck
        if: steps.scope.outputs.relevant == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.scope.outputs.relevant == 'true'
        run: npm test
      - name: Lint
        if: steps.scope.outputs.relevant == 'true'
        run: npm run lint  # flat config; --max-warnings 0 is in the package.json script
      - name: Format check
        if: steps.scope.outputs.relevant == 'true'
        run: npm run format:check
      - name: Production build
        if: steps.scope.outputs.relevant == 'true'
        run: npm run build

  clang-tidy:
    runs-on: ubuntu-latest
    # Structural and API-usage lint. Uses the builder image for
    # compile_commands.json so the analysis sees the real include paths
    # vcpkg resolved. Best-effort: warnings don't gate yet, the .clang-tidy
    # baseline is still being tightened.
    # 90, not 60: cold-cache runs rebuild the vcpkg world (~35 min) before
    # analysis starts — see build-and-test.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2  # HEAD^ fallback for the push-event scope diff

      - name: Scope — does the diff touch anything this job builds?
        # Self-scoping, NOT a workflow-level `paths:` filter: the job always
        # STARTS (required-check semantics stay honest — a skipped required
        # job reports success while checking nothing), computes the diff
        # itself, and exits green in seconds when none of its inputs changed.
        # Fail-open: any trouble computing the diff ⇒ run the job in full.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          RELEVANT: '^(src/|tests/|migrations/|docker/|config/|templates/|third_party/|scripts/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|Makefile$|\.github/workflows/ci\.yml$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename') || changed=""
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push: diff the whole push (before..sha), not just its last
            # commit — a multi-commit push would otherwise hide every change
            # but the head's. Fetch the old tip (the checkout is shallow);
            # any failure (force-push to an unreachable SHA) fails open below.
            changed=$(git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" >/dev/null 2>&1 &&
              git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" 2>/dev/null) || changed=""
          else
            # push that created the branch (before is all zeros): first-parent
            # diff of the head (checkout fetched depth 2). HEAD^ is absent on a
            # root commit → fail open below.
            changed=$(git diff --name-only HEAD^..HEAD 2>/dev/null) || changed=""
          fi
          if [ -z "$changed" ]; then
            echo "could not determine the changed files — failing open, job runs in full"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$RELEVANT"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "paths untouched — verified nothing this job covers is affected; exiting green"
          fi

      - name: Free runner disk for the vcpkg build
        # vcpkg writes debug and release libs into the builder layers, and the
        # tree only grows: master run 41201001899 died with "no space left on
        # device" in libprotocd.a and held up the v1.54.0 tag. The removed
        # SDKs (.NET, Android, GHC, CodeQL) are not used by any job here.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Expose Actions cache env for sccache
        # Exports ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN so sccache (inside
        # docker builds and `docker run` compile steps) can talk to the Actions
        # cache API. The Dockerfile receives them as BuildKit secrets — never
        # ARGs — so layer cache keys and image history stay credential-free.
        if: steps.scope.outputs.relevant == 'true'
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124  # v3.1.0

      - name: Build builder image
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          load: true
          tags: life-os-cpp-ci:builder
          build-args: ENABLE_WERROR=ON
          secrets: |
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Run clang-tidy inside builder
        # continue-on-error: ratchet — flip to false once the baseline is
        # clean. It is NOT clean: baseline 364 unique warnings in src/
        # (981 raw lines — headers repeat across TUs) as of 2026-08-23,
        # master run 32594916143; ~70% is readability-identifier-naming.
        # Checks come from .clang-tidy in the repo root (mounted read-only):
        # bugprone-*, performance-*, portability-*, clang-analyzer-*.
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        run: |
          docker run --rm \
              -v "$PWD":/src \
              -v "$PWD/.clang-tidy":/app/.clang-tidy:ro \
              --entrypoint /bin/bash \
              life-os-cpp-ci:builder -c "
                  apt-get update -qq && apt-get install -y -qq clang-tidy >/dev/null && \
                  run-clang-tidy -p /app/build -quiet -header-filter='src/.*' /app/src/ \
                      | tee /src/clang-tidy.log
              "

      - name: Upload clang-tidy log
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          if-no-files-found: ignore
