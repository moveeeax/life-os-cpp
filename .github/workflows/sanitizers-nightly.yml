      - name: Build & run unit + integration tests with TSan
        # Same sccache pass-through as the sanitizers job (TSan flags form
        # their own cache entries), same compose-network + CI_REQUIRE_INFRA=1
        # wiring, same unit-first ordering for the fast signal.
        if: steps.scope.outputs.relevant == 'true'
        run: |
          NET=$(docker inspect life_os_cpp_test_postgres \
            --format '{{range $k, $_ := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run --rm \
              --network "$NET" \
              -e TEST_PG_HOST=test-postgres \
              -e TEST_REDIS_HOST=test-redis \
              -e CI_REQUIRE_INFRA=1 \
              -e SCCACHE_GHA_ENABLED=on \
              -e ACTIONS_CACHE_SERVICE_V2 \
              -e ACTIONS_RESULTS_URL \
              -e ACTIONS_RUNTIME_TOKEN \
              --entrypoint /bin/bash \
              life-os-cpp-ci:builder -c "
                  set -e
                  cd /app
                  rm -rf build-tsan
                  # sccache starts its server on the first compile and gives
