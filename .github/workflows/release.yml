name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Rebuild an already released tag (e.g. to add arm64 to an older version).
  # Republishes the same image tags; leaves the GitHub Release alone.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (e.g. v1.17.1)
        required: true
        type: string
      force:
        description: Rebuild even though GHCR already carries this version (overwrites the published tags)
        required: false
        type: boolean
        default: false

# Publishes linux/amd64 + linux/arm64 images on tags matching v<semver>. Each
# architecture builds natively on its own hosted runner (ubuntu-latest and
# ubuntu-24.04-arm), never under QEMU: an emulated C++ build takes hours (see
# docs/CI-PROFILES.md). Uses the repo's existing multi-stage Dockerfile — runtime is the default final stage,
# worker-runtime is the worker image. Both get tagged with the git tag and,
# for a release tag without a '-' (not a pre-release), :latest.
#
# Registry: GHCR `ghcr.io/moveeeax/life-os-cpp{,-worker,-frontend}`, which is
# what docker/docker-compose.yml and the helm values pull. Login uses the
# job's GITHUB_TOKEN (packages: write); no extra repo secrets are needed.
#
# Build order:
#   0. verify-tag     — v<semver> tag that exists and sits on master; a manual
#                       rebuild of a version GHCR already carries needs force
#      ci-green       — waits for the CI run of the tagged SHA (push on master)
#                       and fails unless it concluded success; runs alongside
#                       the build, gates promote
#   1. build-staging  — per-arch native builds, pushed by digest (no tags)
#      merge-staging  — imagetools create stitches both digests into :<version>-staging
#   2. scan           — Trivy gates on the staging tags (app, worker, frontend);
#                       fails release on fixable CRITICAL or HIGH
#   3. supply-chain   — SPDX SBOM per image (syft), cosign keyless sign + SBOM
#                       attest of the staging digest
#   4. promote        — imagetools create stitches the signed staging digest into
#                       :<version>/:latest (needs scan, supply-chain, ci-green)
#   5. github-release — GitHub Release notes + SBOM assets (needs: promote, supply-chain)
#
# Least privilege: no workflow-wide token scope. Each job declares only the
# permissions it actually needs.
permissions: {}

# One run per release tag: a re-pushed tag or a manual rebuild of the same tag
# queues behind the running one instead of racing it on the GHCR tags. Never
# cancel a run halfway: that can leave a staging tag without its promotion.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Single source of truth for the published image namespace. Derived from the
  # repo (ghcr.io/moveeeax/life-os-cpp) so a rename of the GitHub repo moves
  # the images with it and nothing here needs patching. NOTE: docker/
  # docker-compose.yml and the helm values pin the same ghcr.io/moveeeax
  # images by name; if the repo moves, update APP_IMAGE/WORKER_IMAGE and
  # image.repository there too.
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Tag being released: the pushed tag, or the input of a manual rebuild.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout with history (ancestry check)
      packages: read   # look the version up in GHCR (manual rebuild guard)
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # A manual run takes any string as input: refuse anything but an
      # existing v<semver> tag, so a branch or SHA never ships under a
      # version tag.
      - name: Validate release tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a v<semver> tag"; exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::tag ${RELEASE_TAG} does not exist"; exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0  # origin/master and the tag's history for the ancestry check

      # Only commits that reached master ship: a tag pushed from a feature
      # branch (or on a commit later dropped from master) is refused.
      - name: Tagged commit is on master
        id: sha
        run: |
          sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          echo "tag ${RELEASE_TAG} -> ${sha}"
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::${RELEASE_TAG} (${sha}) is not an ancestor of origin/master — release only from master"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A manual run republishes :<version>; doing that over a version that
      # already shipped replaces the image prod may be running. Allowed only
      # with the explicit force input.
      - name: Manual rebuild guard
        if: github.event_name == 'workflow_dispatch'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          version="${RELEASE_TAG#v}"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${version}" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::${IMAGE_NAME}:${version} exists; rebuilding anyway (force)"
            else
              echo "::error::${IMAGE_NAME}:${version} is already published — re-run with force to rebuild it"
              exit 1
            fi
          fi

  # The release builds only what CI already passed. Waits for the CI run of the
  # tagged SHA (the push run on master; tagging right after the merge is
  # normal, so a run still in progress is awaited) and fails unless it
  # concluded success. Runs next to the ~40-minute build; promote needs it.
  ci-green:
    runs-on: ubuntu-latest
    needs: verify-tag
    timeout-minutes: 120
    permissions:
      actions: read  # read the CI workflow's runs
    steps:
      - name: CI succeeded on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          deadline=$(( $(date +%s) + 110 * 60 ))
          while :; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.status) \(.conclusion)"')" || run=""
            if [ -z "$run" ]; then
              echo "no CI push run for ${SHA} yet"
            else
              read -r id status conclusion <<< "$run"
              echo "CI run ${id}: status=${status} conclusion=${conclusion}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "::error::CI run ${id} for ${SHA} concluded '${conclusion}' — fix master (or re-run CI) before releasing"
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::gave up waiting for a successful CI run on ${SHA}"
              exit 1
            fi
            sleep 60
          done

  build-staging:
    name: build-staging (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # Default gha scope, so amd64 keeps the warm cache from before arm64.
            cache: buildkit
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: buildkit-arm64
    runs-on: ${{ matrix.runner }}
    needs: verify-tag
    # A cold arm64 run rebuilds the whole vcpkg world (~35 min) before compiling.
    timeout-minutes: 90
    permissions:
      contents: read   # checkout
      packages: write  # push images to GHCR
    steps:
      # The SHA verify-tag checked, not the tag name: a tag moved in between
      # cannot swap the sources under the build.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}

      - name: Extract version
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # Push by digest only: merge-staging stitches the per-arch digests into
      # the :<version>-staging index, so a half-built release never gets a tag.
      - name: Build and push app image (by digest)
        id: app
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          # APP_VERSION stamps the tag into the binary (Core::version(),
          # GET /health) — without it the image reports the baked CMake
          # fallback, which went three releases stale before anyone noticed.
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          # runtime-base installs the runtime packages with apt-get. Replayed
          # from the gha cache while ubuntu:24.04 keeps its tag's digest, that
          # layer keeps the package versions of its first build, misses every
          # security fix since, and Trivy fails the release. Rebuild it on
          # every release; the builder stages stay cached.
          no-cache-filters: runtime-base
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
          sbom: true
          provenance: mode=max

      - name: Build and push worker image (by digest)
        id: worker
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: worker-runtime
          platforms: linux/${{ matrix.arch }}
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          no-cache-filters: runtime-base
          outputs: type=image,name=${{ env.IMAGE_NAME }}-worker,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
          sbom: true
          provenance: mode=max

      - name: Build and push frontend image (by digest)
        id: frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # The runtime stage runs `apk upgrade`, which must run again on every
          # release for the same reason as runtime-base.
          no-cache-filters: runtime
          outputs: type=image,name=${{ env.IMAGE_NAME }}-frontend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
          sbom: true
          provenance: mode=max

      - name: Export digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$APP_DIGEST" > digests/app
          echo "$WORKER_DIGEST" > digests/worker
          echo "$FRONTEND_DIGEST" > digests/frontend

      - name: Upload digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge-staging:
    runs-on: ubuntu-latest
    needs: build-staging
    permissions:
      packages: write  # push the multi-arch staging index to GHCR
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: digests-*
          path: digests

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Create multi-arch staging tags
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for img in app worker frontend; do
            case "$img" in
              app) name="${IMAGE_NAME}" ;;
              *)   name="${IMAGE_NAME}-${img}" ;;
            esac
            docker buildx imagetools create -t "${name}:${VERSION}-staging" \
              "${name}@$(cat digests/digests-amd64/${img})" \
              "${name}@$(cat digests/digests-arm64/${img})"
            docker buildx imagetools inspect "${name}:${VERSION}-staging"
          done

  scan:
    name: scan (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: merge-staging
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: read   # pull staging images from GHCR for scanning
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Vulnerability gate — scan the staging tags before they get promoted to
      # :latest/:version. Fails on a fixable CRITICAL or HIGH so nothing broken ships.
      # The multi-arch manifest index requires an explicit platform hint for
      # Trivy, so the matrix scans each architecture separately.
      - name: Scan app image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-staging
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          image-config-scanners: ''
          scan-type: image
          platform: ${{ matrix.platform }}

      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-worker:${{ steps.ver.outputs.version }}-staging
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          image-config-scanners: ''
          scan-type: image
          platform: ${{ matrix.platform }}

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-frontend:${{ steps.ver.outputs.version }}-staging
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          image-config-scanners: ''
          scan-type: image
          platform: ${{ matrix.platform }}

  # Supply chain: for each image, generate an SPDX SBOM with syft, sign the
  # image keyless with cosign (OIDC — Fulcio binds the signature to THIS
  # workflow's identity, no long-lived key to leak or rotate), and attach the
  # SBOM as a cosign attestation. It runs on the scanned STAGING digest,
  # before promote: no :<version> or :latest tag ever points at an unsigned
  # image. A signature belongs to the manifest DIGEST, so it covers every tag
  # promote later points at it (promote checks the digest did not change).
  # Verify commands: SECURITY.md § "Verifying release images and SBOMs".
  supply-chain:
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      packages: write  # push cosign signatures/attestations next to the images in GHCR
      id-token: write  # mint the OIDC token cosign trades for a Fulcio signing cert
    outputs:
      app: ${{ steps.sign.outputs.app }}
      worker: ${{ steps.sign.outputs.worker }}
      frontend: ${{ steps.sign.outputs.frontend }}
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: SBOM + sign + attest (app, worker, frontend)
        id: sign
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          for img in app worker frontend; do
            case "$img" in
              app) image="${IMAGE_NAME}" ;;
              *)   image="${IMAGE_NAME}-${img}" ;;
            esac
            digest=$(docker buildx imagetools inspect "${image}:${VERSION}-staging" \
              --format '{{println .Manifest.Digest}}')
            base=$(basename "${image}")
            sbom_file="sbom/${base}-${VERSION}.spdx.json"
            echo "::group::${image}@${digest}"
            "${SYFT}" "registry:${image}@${digest}" -o "spdx-json=${sbom_file}"
            cosign sign --yes "${image}@${digest}"
            cosign attest --yes --type spdxjson --predicate "${sbom_file}" "${image}@${digest}"
            echo "::endgroup::"
            echo "${img}=${digest}" >> "$GITHUB_OUTPUT"
          done

      # Hand the SBOM files to the github-release job so they land on the
      # Release page as downloadable assets (same bytes as the attestation).
      - name: Upload SBOMs for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sboms
          path: sbom/*.spdx.json
          if-no-files-found: error

  promote:
    runs-on: ubuntu-latest
    # Scanned, signed, and CI green on the tagged SHA — only then do the
    # public tags move.
    needs: [scan, supply-chain, ci-green]
    env:
      # :latest moves only on a pushed tag; a manual rebuild of an older tag
      # must not drag :latest back to it, and a pre-release tag (one with a
      # '-', such as v1.32.0-rc1) must not move it either: compose pulls
      # :latest.
      LATEST: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') && '1' || '' }}
    permissions:
      contents: read
      packages: write  # promote staging digests to release tags in GHCR
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # Promote by digest — imagetools create stitches the signed digest into
      # the final public tags without any layer re-pull or rebuild, then checks
      # the published tag resolves to exactly the digest supply-chain signed.
      - name: Promote app, worker, frontend to version + latest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APP_DIGEST: ${{ needs.supply-chain.outputs.app }}
          WORKER_DIGEST: ${{ needs.supply-chain.outputs.worker }}
          FRONTEND_DIGEST: ${{ needs.supply-chain.outputs.frontend }}
        run: |
          set -euo pipefail
          for img in app worker frontend; do
            case "$img" in
              app)      image="${IMAGE_NAME}";          signed="$APP_DIGEST" ;;
              worker)   image="${IMAGE_NAME}-worker";   signed="$WORKER_DIGEST" ;;
              frontend) image="${IMAGE_NAME}-frontend"; signed="$FRONTEND_DIGEST" ;;
            esac
            [ -n "$signed" ] || { echo "::error::no signed digest for ${img}"; exit 1; }
            docker buildx imagetools create \
              -t "${image}:${VERSION}" \
              ${LATEST:+-t "${image}:latest"} \
              "${image}@${signed}"
            got=$(docker buildx imagetools inspect "${image}:${VERSION}" \
              --format '{{println .Manifest.Digest}}')
            if [ "$got" != "$signed" ]; then
              echo "::error::${image}:${VERSION} is ${got}, but the signed digest is ${signed}"
              exit 1
            fi
            echo "${image}:${VERSION} -> ${got} (signed)"
          done

  github-release:
    # A manual rebuild of an old tag republishes images only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [promote, supply-chain]
    permissions:
      contents: write  # create the GitHub Release + tag notes
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sboms
          path: sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: sbom/*.spdx.json
