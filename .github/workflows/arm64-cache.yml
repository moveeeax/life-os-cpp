# Warms the arm64 compiler cache after every change to the sources, so a
# release's arm64 image compiles against sccache's objects the way the
# amd64 one does. CI compiles on amd64 only; without this the arm64
# build-staging of release.yml started cold every time (44:47 for v1.58.4
# against 7:55 on amd64 with a warm cache). Nothing is pushed: the build's
# only product is the sccache entries in the Actions cache (aarch64 keys),
# plus the BuildKit layer cache scope release.yml reads.
name: arm64-cache

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - vcpkg.json
      - docker/Dockerfile
  schedule:
    - cron: '17 1 * * 1'  # weekly, before the week's releases
  workflow_dispatch:

# A newer push supersedes the warm-up in flight: the cache it would have
# filled is the previous tree's.
concurrency:
  group: arm64-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free runner disk for the vcpkg build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af >/dev/null 2>&1 || true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Expose Actions cache env for sccache
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124  # v3.1.0

      - name: Build the builder stage on arm64 (sccache fills the cache)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          platforms: linux/arm64
          push: false
          # ENABLE_WERROR=ON as in CI and release.yml, so the keys match.
          build-args: ENABLE_WERROR=ON
          secrets: |
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
          cache-from: type=gha,scope=buildkit-arm64
          cache-to: type=gha,scope=buildkit-arm64,mode=max,ignore-error=true
