name: Feature request
description: Suggest an improvement to life-os-cpp
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please make the case below: what the change fixes or enables, and why
        it belongs in this service rather than in a one-off script.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that the service makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you add or change, and roughly how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why this one is better.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I'm willing to open a merge/pull request for this
          required: false
